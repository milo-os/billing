# This kustomization program is used to create all of the Milo IAM roles that
# are available to users.
#
# Each role should have a corresponding configuration file in this directory.

resources:
  - billing-admin.yaml
  - billing-viewer.yaml
  - meter-definition-admin.yaml
  - meter-definition-viewer.yaml
  - monitored-resource-type-admin.yaml
  - monitored-resource-type-viewer.yaml
  - payment-method-class-admin.yaml
  - payment-method-class-viewer.yaml
