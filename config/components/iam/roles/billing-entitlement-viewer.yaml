apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: billing.miloapis.com-billing-entitlement-viewer
  annotations:
    kubernetes.io/display-name: Billing Entitlement Viewer
    kubernetes.io/description: "View billing entitlements and invoice requests"
spec:
  launchStage: Alpha
  includedPermissions:
    - billing.miloapis.com/billingentitlements.list
    - billing.miloapis.com/billingentitlements.get
    - billing.miloapis.com/billingentitlements/status.get
    - billing.miloapis.com/billingentitlements.watch
    - billing.miloapis.com/invoicerequests.list
    - billing.miloapis.com/invoicerequests.get
    - billing.miloapis.com/invoicerequests/status.get
    - billing.miloapis.com/invoicerequests.watch
