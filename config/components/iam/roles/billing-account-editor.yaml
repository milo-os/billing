# Bound to staff only (see the staff PolicyBindings in infra), so support can
# fix a billing account's contact details, address and tax IDs when the
# customer can't. Unlike Billing Admin it can't create or delete accounts.
# Milo grants whole verbs, not fields: the BillingAccount webhook is what keeps
# payment terms (staff grant those through a BillingArrangement) and an active
# account's currency from changing.
apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: billing.miloapis.com-account-editor
  annotations:
    kubernetes.io/display-name: Billing Account Editor
    kubernetes.io/description: "Edit existing billing accounts' contact details, address and tax IDs"
spec:
  launchStage: Alpha
  includedPermissions:
    - billing.miloapis.com/billingaccounts.get
    - billing.miloapis.com/billingaccounts.update
    - billing.miloapis.com/billingaccounts.patch
