apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: billing.miloapis.com-billingaccount
spec:
  serviceRef:
    name: "billing.miloapis.com"
  kind: BillingAccount
  plural: billingaccounts
  singular: billingaccount
  permissions:
    - list
    - get
    - create
    - update
    - patch
    - delete
    - watch
    # Checked by billing's webhook, never requested: see Billing Account Editor.
    - editContactDetails
    - manageSettings
  subresources:
    - name: status
      permissions:
        - get
        - update
        - patch
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Organization
