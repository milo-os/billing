# Activity policies for billing's user-facing API resources. These get
# applied into the milo-system namespace of the milo control plane by a
# dedicated FluxCD Kustomization on the deploy side so they reconcile
# only after activity-system is up (the activity.miloapis.com CRDs are
# served by the activity-system aggregated apiserver). Modelled after
# milo/services/activity/policies/<service>/ but co-located with the
# service that owns the underlying resources.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The owner the activity processor reads to route a failing policy's alerts.
# This repository owns billing.miloapis.com, and the platform's service
# catalog lists it under the billing service, team billing.
labels:
  - pairs:
      meta.datumapis.com/service: billing
      meta.datumapis.com/team: billing

resources:
  - billingaccount-policy.yaml
  - billingaccountbinding-policy.yaml
  - billingarrangement-policy.yaml
  - billingarrangementapplication-policy.yaml
  - billingarrangementdecline-policy.yaml
  - billingentitlement-policy.yaml
  - charge-policy.yaml
  - invoice-policy.yaml
  - invoicerequest-policy.yaml
  - offer-policy.yaml
  - paymentmethod-policy.yaml
