# ActivityPolicy for BillingAccount resources.
# Defines how BillingAccount API operations appear in activity timelines.
#
# Audit rules handle CRUD operations captured by the Kubernetes API server audit log.
# eventRules cover what billing's controller records on the account (see
# api/v1alpha1/events.go): the account falling past due and becoming current
# again, and billing making a card the default. They also cover InvoiceSent,
# which the payment processor's provider (stripe-provider) records on the
# account each time an invoice is emailed, and a contract's term reaching
# its renewal notice, its end, a renewal or a stop, and a stop billing
# couldn't make.
#
# Design principles:
# - Prefer contactInfo.businessName / contactInfo.name as the display label,
#   falling back to the BillingAccount metadata name. The has() guards mean
#   create entries surface the human-recognisable label while delete entries
#   (which carry no requestObject) cleanly degrade to the resource name.
# - Action-oriented language ("created billing account", ...)
# - Exclude system actors so controller reconciliation does not generate noise.
# - Say when a person changes the default payment method, rather than
#   "updated billing account". Only merge patches that set nothing but
#   spec.defaultPaymentMethodRef match, so other edits read as updates.
# - Say when a person edits the billing contact, address or tax IDs (customers
#   in the cloud portal, staff in the staff portal).
# - Event rules read their detail from event.billing.miloapis.com/
#   annotations and guard each one they read, because a summary that errors
#   sends the event to the dead-letter queue.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: billing.miloapis.com-billingaccount
spec:
  resource:
    apiGroup: billing.miloapis.com
    kind: BillingAccount

  auditRules:
    - name: create-with-business-name
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.contactInfo) && has(audit.requestObject.spec.contactInfo.businessName) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created billing account {{ audit.requestObject.spec.contactInfo.businessName }}"

    - name: create-with-contact-name
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.contactInfo) && has(audit.requestObject.spec.contactInfo.name) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created billing account for {{ audit.requestObject.spec.contactInfo.name }}"

    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created billing account {{ link(audit.responseObject.metadata.name, audit.objectRef) }}"

    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted billing account {{ audit.objectRef.name }}"

    # "Jo made payment method visa-4242 the default for billing account acme"
    - name: set-default-payment-method
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'patch' && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && size(audit.requestObject.spec) == 1 && has(audit.requestObject.spec.defaultPaymentMethodRef) && type(audit.requestObject.spec.defaultPaymentMethodRef) == map && has(audit.requestObject.spec.defaultPaymentMethodRef.name) && type(audit.requestObject.spec.defaultPaymentMethodRef.name) == string && has(audit.objectRef.namespace) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} made payment method {{ link(audit.requestObject.spec.defaultPaymentMethodRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'paymentmethods', 'namespace': audit.objectRef.namespace, 'name': audit.requestObject.spec.defaultPaymentMethodRef.name}) }} the default for billing account {{ link(audit.objectRef.name, audit.objectRef) }}"

    # The portals' billing details forms: "Jo updated the billing details for
    # billing account acme". Only merge patches that set nothing in spec but
    # contactInfo and taxIds match; the cloud portal's display-name annotation
    # may ride along in metadata.
    - name: update-billing-details
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'patch' && !has(audit.objectRef.subresource) && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && size(audit.requestObject.spec) > 0 && audit.requestObject.spec.all(k, k in ['contactInfo', 'taxIds']) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated the billing details for billing account {{ link(audit.objectRef.name, audit.objectRef) }}"

    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated billing account {{ link(audit.objectRef.name, audit.objectRef) }}"

  eventRules:
    # Billing sets the default itself when an account's only card is confirmed:
    # "Visa ending 4242 is now the default payment method for billing account acme"
    - name: default-payment-method-card
      match: "event.reason == 'DefaultPaymentMethodChanged' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/payment-method' in event.metadata.annotations && 'event.billing.miloapis.com/card-brand' in event.metadata.annotations && 'event.billing.miloapis.com/card-last4' in event.metadata.annotations"
      summary: "{{ link((event.metadata.annotations['event.billing.miloapis.com/card-brand'] in {'visa': 'Visa', 'mastercard': 'Mastercard', 'amex': 'American Express', 'discover': 'Discover', 'diners': 'Diners Club', 'jcb': 'JCB', 'unionpay': 'UnionPay', 'cartes_bancaires': 'Cartes Bancaires'} ? {'visa': 'Visa', 'mastercard': 'Mastercard', 'amex': 'American Express', 'discover': 'Discover', 'diners': 'Diners Club', 'jcb': 'JCB', 'unionpay': 'UnionPay', 'cartes_bancaires': 'Cartes Bancaires'}[event.metadata.annotations['event.billing.miloapis.com/card-brand']] : 'Card') + ' ending ' + event.metadata.annotations['event.billing.miloapis.com/card-last4'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'paymentmethods', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/payment-method']}) }} is now the default payment method for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }}"

    - name: default-payment-method
      match: "event.reason == 'DefaultPaymentMethodChanged' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/payment-method' in event.metadata.annotations"
      summary: "Payment method {{ link(event.metadata.annotations['event.billing.miloapis.com/payment-method'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'paymentmethods', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/payment-method']}) }} is now the default payment method for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }}"

    - name: default-payment-method-fallback
      match: "event.reason == 'DefaultPaymentMethodChanged' && has(event.regarding.namespace)"
      summary: "Billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} has a new default payment method"

    # "Billing account acme is past due on invoice acme-2026-10"
    - name: past-due
      match: "event.reason == 'InvoicingPastDue' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/invoice' in event.metadata.annotations"
      summary: "Billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} is past due on invoice {{ link(event.metadata.annotations['event.billing.miloapis.com/invoice'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/invoice']}) }}"

    # "Billing account acme is no longer past due"
    - name: invoicing-status
      match: "event.reason in ['InvoicingPastDue', 'InvoicingCurrent'] && has(event.regarding.namespace)"
      summary: "Billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} {{ event.reason == 'InvoicingPastDue' ? 'is past due' : 'is no longer past due' }}"

    # A payment processor's provider records each time an invoice is emailed, re-sends
    # included. The first send comes before the Invoice is projected, so the event is on the
    # account and names the Invoice only once it exists:
    # "Invoice ACME-0042 for billing account acme was emailed: USD 1250.00, due 18 December 2026"
    - name: invoice-sent-linked
      match: "event.reason == 'InvoiceSent' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/invoice-number' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount' in event.metadata.annotations && 'event.billing.miloapis.com/invoice' in event.metadata.annotations"
      summary: "Invoice {{ link(event.metadata.annotations['event.billing.miloapis.com/invoice-number'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/invoice']}) }} for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} was emailed{{ ': ' + event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount'] }}{{ 'event.billing.miloapis.com/due-date' in event.metadata.annotations ? ', due ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getFullYear()) : '' }}"

    - name: invoice-sent
      match: "event.reason == 'InvoiceSent' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/invoice-number' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount' in event.metadata.annotations"
      summary: "Invoice {{ event.metadata.annotations['event.billing.miloapis.com/invoice-number'] }} for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} was emailed{{ ': ' + event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount'] }}{{ 'event.billing.miloapis.com/due-date' in event.metadata.annotations ? ', due ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getFullYear()) : '' }}"

    - name: invoice-sent-fallback
      match: "event.reason == 'InvoiceSent' && has(event.regarding.namespace)"
      summary: "An invoice for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} was emailed"

    # Contracts reaching a point in their term on their own (api/v1alpha1/events.go).
    # Staff changing a term are recorded from the BillingEntitlement's audit log.
    # ContractRenewalDue carries no organization scope, so only staff see it:
    # "The contract for billing account acme ends its term on 18 April 2029, and will renew for 12 months"
    - name: contract-renewal-due
      match: "event.reason == 'ContractRenewalDue' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/ends-at' in event.metadata.annotations && 'event.billing.miloapis.com/at-end' in event.metadata.annotations"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} ends its term on {{ string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getFullYear()) }}, and will {{ event.metadata.annotations['event.billing.miloapis.com/at-end'] == 'Renew' && 'event.billing.miloapis.com/months' in event.metadata.annotations ? 'renew for ' + event.metadata.annotations['event.billing.miloapis.com/months'] + ' months' : (event.metadata.annotations['event.billing.miloapis.com/at-end'] == 'Stop' ? 'stop' : 'carry on month to month') }}"

    - name: contract-renewal-due-fallback
      match: "event.reason == 'ContractRenewalDue' && has(event.regarding.namespace)"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} is due for renewal"

    # "The contract for billing account acme ended its term on 18 April 2029, and carries on month to month"
    - name: contract-term-ended
      match: "event.reason == 'ContractTermEnded' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/ends-at' in event.metadata.annotations"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} ended its term on {{ string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getFullYear()) }}, and carries on month to month"

    - name: contract-term-ended-fallback
      match: "event.reason == 'ContractTermEnded' && has(event.regarding.namespace)"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} ended its term, and carries on month to month"

    # "The contract for billing account acme renewed for 12 months, until 18 April 2030"
    - name: contract-renewed
      match: "event.reason == 'ContractRenewed' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/months' in event.metadata.annotations && 'event.billing.miloapis.com/ends-at' in event.metadata.annotations"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} renewed for {{ event.metadata.annotations['event.billing.miloapis.com/months'] }} months, until {{ string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getFullYear()) }}"

    - name: contract-renewed-fallback
      match: "event.reason == 'ContractRenewed' && has(event.regarding.namespace)"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} renewed"

    # "The contract for billing account acme ended on 18 April 2029"
    - name: contract-stopped
      match: "event.reason == 'ContractStopped' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/ends-at' in event.metadata.annotations"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} ended on {{ string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getFullYear()) }}"

    - name: contract-stopped-fallback
      match: "event.reason == 'ContractStopped' && has(event.regarding.namespace)"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} ended"

    # Billing couldn't move the account onto the Offer its contract stops to, usually because
    # the Offer was retired since. Staff only: "The contract for billing account acme was due to
    # stop on 18 April 2029, but the account can't move onto offer payg-v6"
    - name: contract-stop-blocked
      match: "event.reason == 'ContractStopBlocked' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/ends-at' in event.metadata.annotations && 'event.billing.miloapis.com/offer' in event.metadata.annotations"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} was due to stop on {{ string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/ends-at'])).getFullYear()) }}, but the account can't move onto offer {{ link(event.metadata.annotations['event.billing.miloapis.com/offer'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': event.metadata.annotations['event.billing.miloapis.com/offer']}) }}"

    - name: contract-stop-blocked-fallback
      match: "event.reason == 'ContractStopBlocked' && has(event.regarding.namespace)"
      summary: "The contract for billing account {{ link(event.regarding.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} couldn't stop"
