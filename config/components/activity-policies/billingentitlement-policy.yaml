# SPDX-License-Identifier: AGPL-3.0-only

# ActivityPolicy for BillingEntitlement resources.
# A BillingEntitlement puts a billing account on an Offer and, for a
# contract, says when it starts. It lives in the organization's namespace, so
# these entries reach the organization's billing timeline.
#
# Design principles:
# - Name the billing account and the Offer (linked).
# - Tell a contract apart from a plain offer: setting one up, changing its
#   fees (a new Offer) and removing it each read as such.
# - The staff portal writes with merge patches, so the rules read what the
#   request changed (spec.contract, spec.offerRef) and the stored object for
#   the rest. Any other write falls through to the update rule.
# - Writes by controllers (service-catalog seeding the default Offer,
#   openmeter-provider's annotations) are left out by the system: prefix.
# - Every rule guards the fields its summary reads, because a summary that
#   errors sends the event to the dead-letter queue.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: billing.miloapis.com-billingentitlement
spec:
  resource:
    apiGroup: billing.miloapis.com
    kind: BillingEntitlement

  auditRules:
    # "Jo set up a contract for billing account acme on offer contract-acme-1, starting 24 November 2026"
    # Staff set up a contract on an account without an entitlement.
    - name: create-contract
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.objectRef.namespace) && has(audit.responseObject.spec) && has(audit.responseObject.spec.billingAccountRef) && has(audit.responseObject.spec.billingAccountRef.name) && has(audit.responseObject.spec.offerRef) && has(audit.responseObject.spec.offerRef.name) && has(audit.responseObject.spec.contract) && has(audit.responseObject.spec.contract.startsAt) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} set up a contract for billing account {{ link(audit.responseObject.spec.billingAccountRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': audit.objectRef.namespace, 'name': audit.responseObject.spec.billingAccountRef.name}) }} on offer {{ link(audit.responseObject.spec.offerRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': audit.responseObject.spec.offerRef.name}) }}, starting {{ string(timestamp(audit.responseObject.spec.contract.startsAt).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(audit.responseObject.spec.contract.startsAt).getMonth()] + ' ' + string(timestamp(audit.responseObject.spec.contract.startsAt).getFullYear()) }}"

    # "Jo put billing account acme on offer payg-v6"
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.objectRef.namespace) && has(audit.responseObject.spec) && has(audit.responseObject.spec.billingAccountRef) && has(audit.responseObject.spec.billingAccountRef.name) && has(audit.responseObject.spec.offerRef) && has(audit.responseObject.spec.offerRef.name) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} put billing account {{ link(audit.responseObject.spec.billingAccountRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': audit.objectRef.namespace, 'name': audit.responseObject.spec.billingAccountRef.name}) }} on offer {{ link(audit.responseObject.spec.offerRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': audit.responseObject.spec.offerRef.name}) }}"

    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created billing entitlement {{ link(audit.objectRef.name, audit.objectRef) }}"

    # Moving an existing account onto a contract: a merge patch setting
    # spec.contract, with the contract's Offer in the same patch.
    # "Jo set up a contract for billing account acme on offer contract-acme-1, starting 24 November 2026"
    - name: add-contract
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'patch' && !has(audit.objectRef.subresource) && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && has(audit.requestObject.spec.contract) && has(audit.objectRef.namespace) && has(audit.responseObject.spec) && has(audit.responseObject.spec.billingAccountRef) && has(audit.responseObject.spec.billingAccountRef.name) && has(audit.responseObject.spec.offerRef) && has(audit.responseObject.spec.offerRef.name) && has(audit.responseObject.spec.contract) && has(audit.responseObject.spec.contract.startsAt) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} set up a contract for billing account {{ link(audit.responseObject.spec.billingAccountRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': audit.objectRef.namespace, 'name': audit.responseObject.spec.billingAccountRef.name}) }} on offer {{ link(audit.responseObject.spec.offerRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': audit.responseObject.spec.offerRef.name}) }}, starting {{ string(timestamp(audit.responseObject.spec.contract.startsAt).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(audit.responseObject.spec.contract.startsAt).getMonth()] + ' ' + string(timestamp(audit.responseObject.spec.contract.startsAt).getFullYear()) }}"

    # An amendment: a contract's account moved to a new Offer.
    # "Jo changed the contract fees for billing account acme: now on offer contract-acme-2"
    - name: change-contract-fees
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'patch' && !has(audit.objectRef.subresource) && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && has(audit.requestObject.spec.offerRef) && has(audit.objectRef.namespace) && has(audit.responseObject.spec) && has(audit.responseObject.spec.billingAccountRef) && has(audit.responseObject.spec.billingAccountRef.name) && has(audit.responseObject.spec.offerRef) && has(audit.responseObject.spec.offerRef.name) && has(audit.responseObject.spec.contract) && has(audit.responseObject.spec.contract.startsAt) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} changed the contract fees for billing account {{ link(audit.responseObject.spec.billingAccountRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': audit.objectRef.namespace, 'name': audit.responseObject.spec.billingAccountRef.name}) }}: now on offer {{ link(audit.responseObject.spec.offerRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': audit.responseObject.spec.offerRef.name}) }}"

    # "Jo switched billing account acme to offer payg-v6"
    - name: switch-offer
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'patch' && !has(audit.objectRef.subresource) && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && has(audit.requestObject.spec.offerRef) && has(audit.objectRef.namespace) && has(audit.responseObject.spec) && has(audit.responseObject.spec.billingAccountRef) && has(audit.responseObject.spec.billingAccountRef.name) && has(audit.responseObject.spec.offerRef) && has(audit.responseObject.spec.offerRef.name) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} switched billing account {{ link(audit.responseObject.spec.billingAccountRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': audit.objectRef.namespace, 'name': audit.responseObject.spec.billingAccountRef.name}) }} to offer {{ link(audit.responseObject.spec.offerRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': audit.responseObject.spec.offerRef.name}) }}"

    - name: update-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated billing entitlement {{ link(audit.objectRef.name, audit.objectRef) }}"

    # "Jo removed the contract and offer contract-acme-1 from billing account acme"
    - name: delete-contract
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.objectRef.namespace) && has(audit.responseObject.spec) && has(audit.responseObject.spec.billingAccountRef) && has(audit.responseObject.spec.billingAccountRef.name) && has(audit.responseObject.spec.offerRef) && has(audit.responseObject.spec.offerRef.name) && has(audit.responseObject.spec.contract) && has(audit.responseObject.spec.contract.startsAt) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} removed the contract and offer {{ link(audit.responseObject.spec.offerRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': audit.responseObject.spec.offerRef.name}) }} from billing account {{ link(audit.responseObject.spec.billingAccountRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': audit.objectRef.namespace, 'name': audit.responseObject.spec.billingAccountRef.name}) }}"

    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.objectRef.namespace) && has(audit.responseObject.spec) && has(audit.responseObject.spec.billingAccountRef) && has(audit.responseObject.spec.billingAccountRef.name) && has(audit.responseObject.spec.offerRef) && has(audit.responseObject.spec.offerRef.name) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} removed offer {{ link(audit.responseObject.spec.offerRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'offers', 'name': audit.responseObject.spec.offerRef.name}) }} from billing account {{ link(audit.responseObject.spec.billingAccountRef.name, {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': audit.objectRef.namespace, 'name': audit.responseObject.spec.billingAccountRef.name}) }}"

    - name: delete-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted billing entitlement {{ audit.objectRef.name }}"
