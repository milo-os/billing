# ActivityPolicy for Invoice resources.
# Only the invoicing provider writes Invoice, as a service account, so the
# audit log has nothing a person did to record. What customers and staff
# need is what happened to the bill, and only the provider knows why an
# invoice changed, so it records an Event for each transition with the
# reasons and annotations defined in api/v1alpha1/events.go.
#
# Design principles:
# - Read the detail from the event.billing.miloapis.com/ annotations, never
#   from the event message, so the wording stays here and vendor text never
#   reaches the timeline.
# - Name the billing account (linked), and call the invoice by its period
#   ("October 2026 invoice"), linked to the Invoice.
# - Show amounts and normalized decline reasons. The billing account's
#   timeline is read by people who can see its invoices; raw vendor decline
#   codes and messages are never shown.
# - Dates render as "30 November 2026". The CEL environment has no string
#   extensions, so they're built from timestamp getters (UTC).
# - InvoiceCurrencyMismatch is operational. The provider records it without
#   scope annotations, so it only reaches the platform (staff) timeline.
# - Every rule guards the annotations its summary reads, because a summary
#   that errors sends the event to the dead-letter queue. An event missing
#   them falls through to the fallback, which needs only the reason.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: billing.miloapis.com-invoice
spec:
  resource:
    apiGroup: billing.miloapis.com
    kind: Invoice

  eventRules:
    # "The October 2026 invoice for billing account acme was issued: USD 482.19, due 30 November 2026"
    - name: issued
      match: "event.reason == 'InvoiceIssued' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount' in event.metadata.annotations"
      summary: "The {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }} was issued: {{ event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount'] }}{{ 'event.billing.miloapis.com/due-date' in event.metadata.annotations ? ', due ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/due-date'])).getFullYear()) : '' }}"

    # "The October 2026 invoice for billing account acme was paid: USD 482.19"
    - name: payment-succeeded
      match: "event.reason == 'InvoicePaymentSucceeded' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount' in event.metadata.annotations"
      summary: "The {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }} was paid: {{ event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount'] }}"

    # "Payment of USD 482.19 for the October 2026 invoice for billing account acme was declined
    # (insufficient funds). Next attempt on 5 November 2026"
    - name: payment-failed
      match: "event.reason == 'InvoicePaymentFailed' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount' in event.metadata.annotations"
      summary: "Payment of {{ event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount'] }} for the {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }} {{ 'event.billing.miloapis.com/decline-reason' in event.metadata.annotations ? (event.metadata.annotations['event.billing.miloapis.com/decline-reason'] in {'Declined': 'was declined', 'InsufficientFunds': 'was declined (insufficient funds)', 'ExpiredCard': 'was declined (the card has expired)', 'AuthenticationRequired': 'was declined (the card holder needs to authenticate it)', 'ProcessingError': 'did not go through (a processing error occurred)'} ? {'Declined': 'was declined', 'InsufficientFunds': 'was declined (insufficient funds)', 'ExpiredCard': 'was declined (the card has expired)', 'AuthenticationRequired': 'was declined (the card holder needs to authenticate it)', 'ProcessingError': 'did not go through (a processing error occurred)'}[event.metadata.annotations['event.billing.miloapis.com/decline-reason']] : 'was declined') : 'was declined' }}{{ 'event.billing.miloapis.com/next-attempt' in event.metadata.annotations ? '. Next attempt on ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/next-attempt'])).getDate()) + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/next-attempt'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/next-attempt'])).getFullYear()) : '' }}"

    # "Payment of USD 482.19 for the October 2026 invoice for billing account acme needs the card
    # holder to confirm it" (3-D Secure / SCA)
    - name: payment-action-required
      match: "event.reason == 'InvoicePaymentActionRequired' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount' in event.metadata.annotations"
      summary: "Payment of {{ event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount'] }} for the {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }} needs the card holder to confirm it"

    # "USD 200.00 was received for the October 2026 invoice for billing account acme; USD 282.19 is
    # still due"
    - name: partially-paid
      match: "event.reason == 'InvoicePartiallyPaid' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount-paid' in event.metadata.annotations && 'event.billing.miloapis.com/amount-due' in event.metadata.annotations"
      summary: "{{ event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount-paid'] }} was received for the {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }}; {{ event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount-due'] }} is still due"

    # "The October 2026 invoice for billing account acme is past due: USD 482.19 outstanding"
    - name: past-due
      match: "event.reason == 'InvoicePastDue' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations && 'event.billing.miloapis.com/amount-due' in event.metadata.annotations"
      summary: "The {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }} is past due: {{ event.metadata.annotations['event.billing.miloapis.com/currency'] + ' ' + event.metadata.annotations['event.billing.miloapis.com/amount-due'] }} outstanding"

    # "The October 2026 invoice for billing account acme was voided"
    - name: voided
      match: "event.reason == 'InvoiceVoided' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations"
      summary: "The {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }} was voided"

    # Staff only. "The October 2026 invoice for billing account acme is in EUR, which does not match
    # the billing account's currency"
    - name: currency-mismatch
      match: "event.reason == 'InvoiceCurrencyMismatch' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.billing.miloapis.com/billing-account' in event.metadata.annotations && 'event.billing.miloapis.com/period-start' in event.metadata.annotations && 'event.billing.miloapis.com/currency' in event.metadata.annotations"
      summary: "The {{ link(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getMonth()] + ' ' + string(timestamp(string(event.metadata.annotations['event.billing.miloapis.com/period-start'])).getFullYear()) + ' invoice', {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'invoices', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} for billing account {{ link(event.metadata.annotations['event.billing.miloapis.com/billing-account'], {'apiGroup': 'billing.miloapis.com', 'apiVersion': 'v1alpha1', 'resource': 'billingaccounts', 'namespace': event.regarding.namespace, 'name': event.metadata.annotations['event.billing.miloapis.com/billing-account']}) }} is in {{ event.metadata.annotations['event.billing.miloapis.com/currency'] }}, which does not match the billing account's currency"

    # An event without the annotations the rules above need: "Invoice acme-2026-10 was paid"
    - name: fallback
      match: "event.reason in ['InvoiceIssued', 'InvoicePaymentSucceeded', 'InvoicePaymentFailed', 'InvoicePaymentActionRequired', 'InvoicePartiallyPaid', 'InvoicePastDue', 'InvoiceVoided', 'InvoiceCurrencyMismatch']"
      summary: "Invoice {{ link(event.regarding.name, event.regarding) }} {{ {'InvoiceIssued': 'was issued', 'InvoicePaymentSucceeded': 'was paid', 'InvoicePaymentFailed': 'had a payment declined', 'InvoicePaymentActionRequired': 'has a payment the card holder needs to confirm', 'InvoicePartiallyPaid': 'was partly paid', 'InvoicePastDue': 'is past due', 'InvoiceVoided': 'was voided', 'InvoiceCurrencyMismatch': 'is in a currency that does not match its billing account'}[event.reason] }}"

