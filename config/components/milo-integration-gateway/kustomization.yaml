apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Wires the usage ingestion gateway to the Milo API server so it can drop
# events for projects with no Active BillingAccountBinding before they are
# written to NATS.
#
# Mounts:
#   - datum-control-plane-trust-bundle (trust-manager)
#   - CSI client cert issued by datum-control-plane (system:masters)
#   - billing-discovery-kubeconfig ConfigMap
#
# The billing-system namespace must have
# `infra.datum.net/inject-datum-control-plane-trust-bundle: ""`.

patches:
  - target:
      kind: Deployment
      name: billing-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubeconfig-path=/etc/kubernetes/project-discovery/auth/discovery-kubeconfig.yaml
  - target:
      kind: Deployment
      name: billing-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: billing-gateway
      spec:
        template:
          spec:
            containers:
              - name: gateway
                volumeMounts:
                  - mountPath: /etc/kubernetes/pki/trust
                    name: trust-bundle
                    readOnly: true
                  - mountPath: /etc/kubernetes/projects/pki/client
                    name: client-cert
                    readOnly: true
                  - mountPath: /etc/kubernetes/project-discovery/auth
                    name: discovery-kubeconfig
                    readOnly: true
            volumes:
              - name: trust-bundle
                configMap:
                  name: datum-control-plane-trust-bundle
              - name: discovery-kubeconfig
                configMap:
                  name: billing-discovery-kubeconfig
              - name: client-cert
                csi:
                  driver: csi.cert-manager.io
                  readOnly: true
                  volumeAttributes:
                    csi.cert-manager.io/common-name: system:control@billing.miloapis.com
                    csi.cert-manager.io/fs-group: "65532"
                    csi.cert-manager.io/issuer-kind: ClusterIssuer
                    csi.cert-manager.io/issuer-name: datum-control-plane
                    csi.cert-manager.io/key-usages: client auth
                    csi.cert-manager.io/organizations: system:masters
