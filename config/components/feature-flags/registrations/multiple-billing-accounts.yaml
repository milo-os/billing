apiVersion: quota.miloapis.com/v1alpha1
kind: ResourceRegistration
metadata:
  name: feature-multiple-billing-accounts
  annotations:
    kubernetes.io/display-name: Multiple Billing Accounts
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/component: feature-flags
    features.miloapis.com/feature-name: multiple-billing-accounts
spec:
  consumerType:
    apiGroup: resourcemanager.miloapis.com
    kind: Organization
  type: Feature
  resourceType: billing.miloapis.com/multiple-billing-accounts
  description: "Allows an organization to hold more than one BillingAccount. Without this entitlement, the BillingAccount admission webhook rejects the second-and-beyond creation attempt for the org."
  baseUnit: feature
  displayUnit: features
  unitConversionFactor: 1
  claimingResources:
    - apiGroup: billing.miloapis.com
      kind: BillingAccount
