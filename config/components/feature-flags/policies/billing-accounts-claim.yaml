apiVersion: quota.miloapis.com/v1alpha1
kind: ClaimCreationPolicy
metadata:
  name: billing-account-quota-enforcement
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/component: feature-flags
    features.miloapis.com/feature-name: billing-accounts
spec:
  # Every BillingAccount creation triggers a 1-unit claim against the
  # billing.miloapis.com/billingaccounts capacity of the owning
  # Organization. The admission plugin derives the Organization from
  # the request's parent context — see
  # milo/docs/architecture/discovery-contexts.md.
  trigger:
    resource:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: BillingAccount
  target:
    resourceClaimTemplate:
      spec:
        # consumerRef is auto-filled by the admission plugin from the
        # request's parent context (Organization), so it is omitted
        # here.
        requests:
          - resourceType: billing.miloapis.com/billingaccounts
            amount: 1
