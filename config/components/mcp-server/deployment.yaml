apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-mcp
  namespace: billing-system
  labels:
    app.kubernetes.io/name: billing-mcp
    app.kubernetes.io/instance: billing-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: billing.miloapis.com
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-mcp
      app.kubernetes.io/instance: billing-mcp
      app.kubernetes.io/component: mcp-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-mcp
        app.kubernetes.io/instance: billing-mcp
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: billing.miloapis.com
    spec:
      serviceAccountName: billing-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/milo-os/billing:dev
          imagePullPolicy: IfNotPresent
          command:
            - /billing
          args:
            - mcp
            - --addr=:8080
            - --kubeconfig=/etc/kubernetes/milo/auth/kubeconfig.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: milo-kubeconfig
              mountPath: /etc/kubernetes/milo/auth
              readOnly: true
            - name: trust-bundle
              mountPath: /etc/kubernetes/pki/trust
              readOnly: true
      volumes:
        # A kubeconfig naming the Milo API server and CA, without
        # credentials, provided by the environment.
        - name: milo-kubeconfig
          configMap:
            name: billing-mcp-milo-kubeconfig
        - name: trust-bundle
          configMap:
            name: datum-control-plane-trust-bundle
      terminationGracePeriodSeconds: 30
