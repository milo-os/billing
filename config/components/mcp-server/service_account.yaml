#
# billing-mcp needs no Kubernetes API access of its own: it reads through Milo
# with each caller's token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing-mcp
  namespace: billing-system
  labels:
    app.kubernetes.io/name: billing-mcp
    app.kubernetes.io/instance: billing-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: billing.miloapis.com
automountServiceAccountToken: false
