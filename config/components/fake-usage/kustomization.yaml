# This component creates BillingAccount and BillingAccountBinding resources for
# the fake usage daemon. It must only be installed in non-production
# environments.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - billingaccount.yaml
  - billingaccountbinding.yaml

sortOptions:
  order: fifo

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: fake-usage
      app.kubernetes.io/part-of: datum-cloud
