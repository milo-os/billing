# BillingAccountBinding for the fake-usage daemon. The owning FluxCD
# Kustomization must dependsOn the fake-usage account Kustomization so the
# referenced BillingAccount exists before admission runs.
# Non-production environments only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Component

resources:
  - billingaccountbinding.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: fake-usage
      app.kubernetes.io/part-of: datum-cloud
