apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-gateway
  namespace: billing-system
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway
          image: ghcr.io/milo-os/billing:dev
          command:
            - /billing
          args:
            - gateway
            - --addr=$(ADDR)
            - --nats-url=$(NATS_URL)
            - --nats-ca-file=$(NATS_CA_FILE)
            - --nats-cert-file=$(NATS_CERT_FILE)
            - --nats-key-file=$(NATS_KEY_FILE)
            - --tls-cert-file=$(TLS_CERT_FILE)
            - --tls-key-file=$(TLS_KEY_FILE)
            - --health-probe-bind-address=$(HEALTH_PROBE_BIND_ADDRESS)
            - --metrics-bind-address=$(METRICS_BIND_ADDRESS)
          env:
            - name: ADDR
              value: ":8080"
            - name: NATS_URL
              value: "tls://nats.nats-system.svc.cluster.local:4222"
            - name: NATS_CA_FILE
              value: "/etc/nats-certs/ca.crt"
            - name: NATS_CERT_FILE
              value: "/etc/nats-certs/tls.crt"
            - name: NATS_KEY_FILE
              value: "/etc/nats-certs/tls.key"
            - name: TLS_CERT_FILE
              value: "/etc/gateway-certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/gateway-certs/tls.key"
            - name: HEALTH_PROBE_BIND_ADDRESS
              value: ":8081"
            - name: METRICS_BIND_ADDRESS
              value: ":8443"
          ports:
            - name: ingest
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nats-certs
              mountPath: /etc/nats-certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: nats-certs
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: nats
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: billing-gateway.nats.client
              csi.cert-manager.io/subject-organizations: datum
              csi.cert-manager.io/fs-group: "65532"
      terminationGracePeriodSeconds: 30
