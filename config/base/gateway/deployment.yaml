apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-gateway
  namespace: billing-system
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: billing-gateway
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway
          image: ghcr.io/milo-os/billing:dev
          command:
            - /billing
          args:
            - gateway
            - --addr=:8080
            - --nats-url=tls://nats.nats-system.svc.cluster.local:4222
            - --nats-ca-file=/etc/nats-certs/ca.crt
            - --nats-cert-file=/etc/nats-certs/tls.crt
            - --nats-key-file=/etc/nats-certs/tls.key
            - --tls-cert-file=/etc/gateway-certs/tls.crt
            - --tls-key-file=/etc/gateway-certs/tls.key
            - --health-probe-bind-address=:8081
          ports:
            - name: ingest
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nats-certs
              mountPath: /etc/nats-certs
              readOnly: true
            - name: gateway-certs
              mountPath: /etc/gateway-certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: nats-certs
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: nats
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: billing-gateway.nats.client
              csi.cert-manager.io/subject-organizations: datum
              csi.cert-manager.io/fs-group: "65532"
        - name: gateway-certs
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: selfsigned-issuer
              csi.cert-manager.io/dns-names: "billing-gateway.billing-system.svc,billing-gateway.billing-system.svc.cluster.local"
              csi.cert-manager.io/fs-group: "65532"
      terminationGracePeriodSeconds: 30
