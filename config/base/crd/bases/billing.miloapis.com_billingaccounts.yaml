---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Organization
  name: billingaccounts.billing.miloapis.com
spec:
  group: billing.miloapis.com
  names:
    kind: BillingAccount
    listKind: BillingAccountList
    plural: billingaccounts
    singular: billingaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.annotations.kubernetes\.io/display-name
      name: Display Name
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.currencyCode
      name: Currency
      type: string
    - jsonPath: .status.linkedProjectsCount
      name: Projects
      type: integer
    - jsonPath: .status.conditions[?(@.type=="PaymentReady")].status
      name: Payment Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BillingAccount is the Schema for the billingaccounts API. It represents a
          billing entity within an organization that is responsible for paying for
          service consumption.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BillingAccountSpec defines the desired state of a BillingAccount.
            properties:
              contactInfo:
                description: |-
                  ContactInfo describes the billing contact and the postal
                  address invoices are issued to.
                properties:
                  address:
                    description: |-
                      Address is the postal billing address. Appears on invoices and
                      is surfaced to the configured provider controller (e.g. for
                      tax determination, AVS).
                    properties:
                      city:
                        description: City is the locality.
                        maxLength: 128
                        type: string
                      country:
                        description: |-
                          Country is the ISO 3166-1 alpha-2 country code (e.g. "GB",
                          "US"). Required because tax determination and currency
                          restrictions depend on it.
                        pattern: ^[A-Z]{2}$
                        type: string
                      line1:
                        description: |-
                          Line1 is the first line of the street address (typically
                          "number + street").
                        maxLength: 256
                        type: string
                      line2:
                        description: |-
                          Line2 is the second line of the street address (typically
                          apartment / suite / building).
                        maxLength: 256
                        type: string
                      postalCode:
                        description: PostalCode is the post / zip code.
                        maxLength: 32
                        type: string
                      region:
                        description: Region is the state, province, or county (free-form).
                        maxLength: 128
                        type: string
                    required:
                    - country
                    type: object
                  businessName:
                    description: |-
                      BusinessName is the legal entity that pays. Optional; populate
                      it for B2B accounts so invoices print the company name as the
                      top header line and the provider Customer record carries the
                      company name rather than the individual contact.

                      When set, the provider controller maps this onto its
                      Customer.name field (e.g. Stripe Customer.name). When unset,
                      Name is used instead.
                    maxLength: 256
                    type: string
                  email:
                    description: |-
                      Email is the primary billing contact email. Receives billing
                      notifications and, when InvoiceEmail is unset, also receives
                      invoices and receipts.
                    minLength: 1
                    type: string
                  invoiceEmails:
                    description: |-
                      InvoiceEmails is where invoices and receipts are emailed. Only the
                      first entry receives them: Stripe emails each invoice to a single
                      address, Customer.email, and the stripe-provider sets that to the
                      first entry, or to Email when the list is empty. No provider sends
                      to later entries, so clients should keep the list to one entry.

                      Duplicate entries are rejected. Maximum 10 entries.
                    items:
                      type: string
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: set
                  name:
                    description: |-
                      Name is the display name of the individual billing contact —
                      the human the platform talks to. Surfaces as the "ATTN:" line
                      on invoices when BusinessName is also set.
                    maxLength: 256
                    type: string
                required:
                - email
                type: object
              currencyCode:
                description: |-
                  CurrencyCode is the ISO 4217 currency code for this billing account.
                  This field is immutable once the account transitions past Provisioning phase.
                pattern: ^[A-Z]{3}$
                type: string
              defaultForNewProjects:
                description: |-
                  DefaultForNewProjects makes this the account the organization's new
                  projects are billed to when it has more than one billing account.
                  With only one, new projects are billed to it either way. At most one
                  account in an organization can set it.
                type: boolean
              defaultPaymentMethodRef:
                description: |-
                  DefaultPaymentMethodRef references the PaymentMethod to use by
                  default for charge processing. The referenced PaymentMethod must
                  reside in the same namespace and be in the Active phase.
                properties:
                  name:
                    description: Name is the name of the PaymentMethod.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              paymentTerms:
                default: {}
                description: |-
                  PaymentTerms defines the invoicing schedule for this billing account.
                  It always holds the standard terms (net 30, invoiced monthly on the
                  1st): the admission webhook rejects anything else on create, and it
                  can't be changed afterwards. Customers who need different terms get
                  them from staff through a BillingArrangement, published on
                  status.paymentArrangement.
                properties:
                  invoiceDayOfMonth:
                    default: 1
                    description: InvoiceDayOfMonth is the day of the month invoices
                      are generated.
                    format: int32
                    maximum: 28
                    minimum: 1
                    type: integer
                  invoiceFrequency:
                    default: Monthly
                    description: InvoiceFrequency determines how often invoices are
                      generated.
                    enum:
                    - Monthly
                    - Quarterly
                    - Annual
                    type: string
                  netDays:
                    default: 30
                    description: NetDays is the number of days after invoice date
                      that payment is due.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: paymentTerms can't be changed; payment terms are granted
                    by Datum staff through a BillingArrangement
                  rule: self == oldSelf
              taxIds:
                description: |-
                  TaxIDs are the tax registrations attached to this account. An
                  account can carry multiple entries (e.g. an organisation
                  registered for both GB VAT and EU VAT).
                items:
                  description: |-
                    TaxID is a single tax registration.

                    Type values follow a vendor-neutral snake-case
                    `<jurisdiction>_<scheme>` convention — e.g. "gb_vat", "eu_vat",
                    "us_ein", "au_abn", "ca_gst_hst", "ch_vat", "in_gst", "sg_gst".
                    The pattern check enforces the shape rather than the exact set of
                    values, so new schemes can be added without API changes.
                    Translation to any provider-specific identifier (if needed) is the
                    responsibility of the provider controller, not this schema.
                  properties:
                    type:
                      description: Type identifies the tax registration scheme (e.g.
                        "gb_vat").
                      maxLength: 32
                      pattern: ^[a-z]{2}_[a-z][a-z_]*$
                      type: string
                    value:
                      description: |-
                        Value is the registration number / identifier
                        (e.g. "GB123456789").
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - type
                  - value
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            required:
            - currencyCode
            type: object
          status:
            description: BillingAccountStatus defines the observed state of a BillingAccount.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the billing
                  account's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contract:
                description: |-
                  Contract summarises the contract on the account's BillingEntitlement,
                  copied with its fees from the contract's published Offer so customers
                  can see their contract without reading the entitlement or the Offer.
                  Set from when the contract is added, including before it starts.
                  Cleared when the account has no contract, or its Offer isn't
                  published.
                properties:
                  billingDay:
                    description: |-
                      BillingDay is how the contract chose its billing day, from its
                      contract.billingDay: StartDate bills on the day it starts, so every
                      period is whole; InvoiceDay bills on the account's invoice day, so the
                      first period runs from the start to the next billing date and is
                      prorated, and quarterly and annual fees bill in January, April, July
                      and October, and in January.
                    enum:
                    - StartDate
                    - InvoiceDay
                    type: string
                  billingDayOfMonth:
                    description: |-
                      BillingDayOfMonth is the day of the month the contract bills on: the
                      day it starts, or the account's invoice day for a contract whose
                      billingDay is InvoiceDay. Months shorter than it bill on their last
                      day.
                    format: int32
                    maximum: 31
                    minimum: 1
                    type: integer
                  fees:
                    description: |-
                      Fees are the contract's fixed fees, before discounts: its one-time
                      fees, such as a setup fee, and its recurring ones, such as a monthly
                      fee. Discounts on them are listed in status.discounts. A contract
                      amended after it started omits the one-time fees already charged.
                    items:
                      description: BillingAccountContractFee is one of a contract's
                        fixed fees.
                      properties:
                        amount:
                          description: |-
                            Amount is the fee's unit amount as a decimal string in currency (e.g.
                            "2400.00"). The contract charges it quantity times.
                          pattern: ^(0|[1-9]\d*)(\.\d+)?$
                          type: string
                        billingTiming:
                          description: |-
                            BillingTiming is when a Recurring fee is invoiced: InAdvance at the
                            start of each period, or InArrears at its end, with that period's
                            usage. Empty for a OneTime fee, which is invoiced when it's charged.
                          enum:
                          - InAdvance
                          - InArrears
                          type: string
                        chargeType:
                          allOf:
                          - enum:
                            - Usage
                            - OneTime
                            - Recurring
                          - enum:
                            - OneTime
                            - Recurring
                          description: |-
                            ChargeType is OneTime for a fee charged once, when the contract
                            starts, or Recurring for one charged every interval.
                          type: string
                        currency:
                          description: Currency is the ISO 4217 currency code of amount.
                          type: string
                        description:
                          description: Description is the pricing's description of
                            what the fee is for.
                          type: string
                        displayName:
                          description: |-
                            DisplayName is the fee's label, as invoices show it (e.g. "Setup
                            fee").
                          maxLength: 128
                          type: string
                        endsAt:
                          description: |-
                            EndsAt is when a Recurring fee with periods stops: the end of its
                            last period, on the contract's billing day. Empty when the fee has
                            no end.
                          format: date-time
                          type: string
                        interval:
                          description: |-
                            Interval is how often a Recurring fee is charged (monthly, quarterly
                            or annual), so amount is per interval. Empty for a OneTime fee.
                          enum:
                          - monthly
                          - quarterly
                          - annual
                          type: string
                        name:
                          description: Name is the metadata.name of the fee's ServicePricing.
                          maxLength: 253
                          minLength: 1
                          type: string
                        periods:
                          description: |-
                            Periods is how many intervals a Recurring fee is charged for,
                            counted from startsAt. Empty when the fee has no end.
                          format: int32
                          minimum: 1
                          type: integer
                        pricingUnit:
                          description: |-
                            PricingUnit is what amount is per (e.g. "port"), so the fee reads
                            "4 port × $300.00". Empty when the quantity is a count of the fee.
                          type: string
                        quantity:
                          description: |-
                            Quantity is how many of the fee the contract charges, so the fee
                            charged is amount times quantity (e.g. 3 × "1000.00").
                          format: int32
                          minimum: 1
                          type: integer
                        servicePeriod:
                          description: |-
                            ServicePeriod is a OneTime fee's supply date, from the contract.
                            Empty when the fee's period is the day it's charged.
                          properties:
                            end:
                              description: End is the last day, as YYYY-MM-DD.
                              maxLength: 10
                              pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
                              type: string
                            start:
                              description: Start is the first day, as YYYY-MM-DD.
                              maxLength: 10
                              pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
                              type: string
                          required:
                          - end
                          - start
                          type: object
                          x-kubernetes-validations:
                          - message: the service period can't end before it starts
                            rule: self.end >= self.start
                        serviceRef:
                          description: |-
                            ServiceRef is the service the fee is for. Empty for a fee that isn't
                            for any one service.
                          maxLength: 253
                          type: string
                        sku:
                          description: SKU is the fee's product code, from its pricing.
                            Empty when it has none.
                          maxLength: 64
                          type: string
                      required:
                      - amount
                      - chargeType
                      - currency
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  startsAt:
                    description: |-
                      StartsAt is when the contract starts, at midnight UTC: its one-time
                      fees are charged then, and its monthly fees bill from then.
                    format: date-time
                    type: string
                  term:
                    description: |-
                      Term is how long the contract runs, what happens when it ends, and
                      where it is now. Empty for a contract without a term.
                    properties:
                      atEnd:
                        description: |-
                          AtEnd is what happens when the term ends: MonthToMonth, Renew or
                          Stop.
                        enum:
                        - MonthToMonth
                        - Renew
                        - Stop
                        type: string
                      currentTermStartsAt:
                        description: |-
                          CurrentTermStartsAt is when the current term started: the contract's
                          start, or the start of its latest renewal. Month to month or
                          stopped, it's when the last term started.
                        format: date-time
                        type: string
                      endsAt:
                        description: |-
                          EndsAt is when the current term ends. Month to month, it's when the
                          last term ended. Stopped, it's when the contract stopped.
                        format: date-time
                        type: string
                      months:
                        description: Months is the first term's length.
                        format: int32
                        type: integer
                      phase:
                        description: Phase is InTerm, MonthToMonth or Stopped.
                        enum:
                        - InTerm
                        - MonthToMonth
                        - Stopped
                        type: string
                      renewMonths:
                        description: RenewMonths is the length of each renewal, when
                          atEnd is Renew.
                        format: int32
                        type: integer
                      renewalDueAt:
                        description: |-
                          RenewalDueAt is when the ContractRenewalDue condition turns on for
                          the current term: ContractRenewalNotice before endsAt. Empty once the
                          contract has stopped.
                        format: date-time
                        type: string
                      renewals:
                        description: Renewals counts the renewals so far, when atEnd
                          is Renew.
                        format: int32
                        type: integer
                      stopsAt:
                        description: |-
                          StopsAt is when a contract set to stop stops: the term's end, or the
                          contract's stopsAt once it's month to month.
                        format: date-time
                        type: string
                    required:
                    - atEnd
                    - currentTermStartsAt
                    - endsAt
                    - months
                    - phase
                    type: object
                  usageBilled:
                    description: |-
                      UsageBilled is true when the contract also bills usage, at the rates
                      in its Offer, on top of its fees.
                    type: boolean
                required:
                - billingDayOfMonth
                - startsAt
                type: object
              discounts:
                description: |-
                  Discounts lists the discount on each service pricing in the account's
                  Offer, copied from the Offer's published snapshot so customers can see
                  their discounts without reading the Offer. Set only while at least one
                  pricing has a discount above 0%; the others are listed at 0%. Cleared
                  when the account has no discount.
                items:
                  description: |-
                    BillingAccountDiscount is one service pricing's resolved discount,
                    published on the account from its Offer's snapshot. It deliberately
                    doesn't name the Offer or say whether staff set the discount for the
                    whole Offer or for this pricing.
                  properties:
                    displayName:
                      description: |-
                        DisplayName is the pricing's human-readable label (e.g. "ALB
                        Requests").
                      maxLength: 128
                      type: string
                    name:
                      description: |-
                        Name is the metadata.name of the ServicePricing the discount applies
                        to.
                      maxLength: 253
                      minLength: 1
                      type: string
                    percentage:
                      description: Percentage is a whole number from 0 to 100.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    serviceRef:
                      description: |-
                        ServiceRef is the service the pricing belongs to (e.g.
                        "networking.datumapis.com").
                      maxLength: 253
                      type: string
                  required:
                  - name
                  - percentage
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              latestInvoiceRef:
                description: |-
                  LatestInvoiceRef references the most recently created Invoice for
                  this billing account. Cleared when no invoices exist.
                properties:
                  name:
                    description: Name is the name of the Invoice.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              linkedProjectsCount:
                description: |-
                  LinkedProjectsCount is the number of projects currently bound to this
                  billing account.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              paymentArrangement:
                description: |-
                  PaymentArrangement summarises the BillingArrangement currently in
                  effect for this account, if any. Cleared when no arrangement is
                  active.
                properties:
                  endsAt:
                    description: |-
                      EndsAt is when the arrangement ends, if it has a fixed end. For
                      terms that end with the contract, it's the contract's stop date once
                      the contract is set to stop, and empty while it will carry on.
                    format: date-time
                    type: string
                  endsWithContract:
                    description: |-
                      EndsWithContract is true when the terms last as long as the
                      account's contract and end when it stops.
                    type: boolean
                  invoice:
                    description: Invoice carries the invoice terms when type is Invoice.
                    properties:
                      accountsPayableEmail:
                        description: |-
                          AccountsPayableEmail receives invoices in addition to the billing
                          contact. When unset, invoices go to the billing contact only.
                        maxLength: 254
                        type: string
                      agreementReference:
                        description: |-
                          AgreementReference identifies a signed MSA or order form, when one
                          exists. Without one, our standard terms of service apply.
                        maxLength: 128
                        type: string
                      creditLimit:
                        description: |-
                          CreditLimit is the most the account should spend per billing cycle,
                          as a decimal string in the billing account's currency (e.g. "10000").
                          It is not a hard cap. Optional: nothing enforces it yet, so staff
                          only set one when finance wants it recorded.
                        pattern: ^(0|[1-9]\d*)(\.\d+)?$
                        type: string
                      netDays:
                        default: 30
                        description: |-
                          NetDays is the number of days after the invoice date that payment
                          is due.
                        format: int32
                        maximum: 90
                        minimum: 1
                        type: integer
                      purchaseOrderNumber:
                        description: PurchaseOrderNumber is printed on invoices.
                        maxLength: 64
                        type: string
                    type: object
                  name:
                    description: Name is the name of the active BillingArrangement.
                    type: string
                  startsAt:
                    description: StartsAt is when the arrangement took effect.
                    format: date-time
                    type: string
                  type:
                    description: Type is how the account is billed.
                    enum:
                    - Invoice
                    type: string
                required:
                - name
                - type
                type: object
              phase:
                description: Phase represents the current lifecycle phase of the billing
                  account.
                enum:
                - Provisioning
                - Ready
                - Suspended
                - Archived
                type: string
              prices:
                description: |-
                  Prices lists every service pricing in the account's Offer, copied from the
                  Offer's published snapshot so customers can see what they're billed at
                  without reading the Offer: usage rates and fixed fees, each before its
                  discount, which is also given. Cleared when the account has no published Offer.
                items:
                  description: |-
                    BillingAccountPrice is one service pricing in the account's Offer, as its
                    published snapshot bills it: a Usage pricing's rates, or a OneTime or
                    Recurring fee's amount. Like BillingAccountDiscount, it doesn't name the
                    Offer, and it leaves out how usage is converted into pricingUnit, how the
                    pricing is taxed and which list pricing it's based on.
                  properties:
                    amount:
                      description: |-
                        Amount is a OneTime or Recurring fee's unit amount, before discount,
                        as a decimal string in currency (e.g. "2400.00"). The fee is charged
                        quantity times. Empty for a Usage pricing.
                      pattern: ^(0|[1-9]\d*)(\.\d+)?$
                      type: string
                    chargeType:
                      description: |-
                        ChargeType is Usage for metered consumption billed at rates, OneTime
                        for a fee charged once, or Recurring for one charged every interval.
                      enum:
                      - Usage
                      - OneTime
                      - Recurring
                      type: string
                    currency:
                      description: Currency is the ISO 4217 currency code of rates
                        and amount.
                      type: string
                    discountPercentage:
                      description: |-
                        DiscountPercentage is the pricing's resolved discount, a whole number
                        up to 100, off its rates or amount. Empty when it has none.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    displayName:
                      description: |-
                        DisplayName is the pricing's human-readable label (e.g. "ALB
                        Requests").
                      maxLength: 128
                      type: string
                    interval:
                      description: |-
                        Interval is how often a Recurring fee is charged (monthly, quarterly
                        or annual), so amount is per interval. Empty otherwise.
                      enum:
                      - monthly
                      - quarterly
                      - annual
                      type: string
                    metric:
                      description: |-
                        Metric is the meterName of the meter a Usage pricing bills (e.g.
                        "networking.datumapis.com/alb/requests"). Empty for a fee.
                      maxLength: 253
                      type: string
                    name:
                      description: Name is the metadata.name of the ServicePricing.
                      maxLength: 253
                      minLength: 1
                      type: string
                    pricingUnit:
                      description: |-
                        PricingUnit is what a Usage pricing's rates are per (e.g. "gib"), or
                        what a fee's amount is per (e.g. "port"). Empty for a fee whose
                        quantity is a count of the fee.
                      maxLength: 64
                      type: string
                    quantity:
                      description: |-
                        Quantity is how many of a fee the Offer charges, so the fee charged
                        is amount times quantity (e.g. 3 × "1000.00"). Empty for a Usage
                        pricing.
                      format: int32
                      minimum: 1
                      type: integer
                    rates:
                      description: |-
                        Rates are a Usage pricing's rates per pricingUnit, before discount,
                        in order: each flat or tiered, optionally for one dimension value,
                        with the last rate without a match applying to the rest. Empty for a
                        fee.
                      items:
                        description: |-
                          PricingRate is a single rate entry. Exactly one of Flat or Tiered must
