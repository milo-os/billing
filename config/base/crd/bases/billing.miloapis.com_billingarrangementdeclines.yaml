---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Organization
  name: billingarrangementdeclines.billing.miloapis.com
spec:
  group: billing.miloapis.com
  names:
    kind: BillingArrangementDecline
    listKind: BillingArrangementDeclineList
    plural: billingarrangementdeclines
    singular: billingarrangementdecline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.applicationRef.name
      name: Application
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BillingArrangementDecline is the Schema for the
          billingarrangementdeclines API.

          A BillingArrangementDecline records staff declining a payment terms
          application. It's a separate resource so the reviewer's internal
          notes stay out of reach of customers, who can read their applications
          but never declines; the customer-facing message is copied onto the
          application's status. Each decline is owned by its application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BillingArrangementDeclineSpec defines the desired state of a
              BillingArrangementDecline.
            properties:
              applicationRef:
                description: |-
                  ApplicationRef references the BillingArrangementApplication in the
                  same namespace that is declined. Immutable.
                properties:
                  name:
                    description: Name is the name of the BillingArrangementApplication.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: applicationRef is immutable
                  rule: self == oldSelf
              internalNotes:
                description: |-
                  InternalNotes record the reviewer's reasoning. Internal: never shown
                  to customers.
                maxLength: 4000
                type: string
              message:
                description: |-
                  Message is shown to the applicant, and copied onto the
                  application's status.declineMessage. Tell them what to do next, for
                  example "Reply to our email with your company registration number,
                  or add a card to continue."
                maxLength: 2000
                minLength: 1
                type: string
            required:
            - applicationRef
            - message
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
