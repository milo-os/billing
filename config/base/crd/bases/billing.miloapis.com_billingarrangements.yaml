---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Organization
  name: billingarrangements.billing.miloapis.com
spec:
  group: billing.miloapis.com
  names:
    kind: BillingArrangement
    listKind: BillingArrangementList
    plural: billingarrangements
    singular: billingarrangement
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.billingAccountRef.name
      name: Account
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.startsAt
      name: Starts
      type: date
    - jsonPath: .spec.endsAt
      name: Ends
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BillingArrangement is the Schema for the billingarrangements API.

          A BillingArrangement records payment terms staff have granted to a
          billing account, letting it be billed without a card. Only staff can
          create or change arrangements; customers see the active terms through
          BillingAccount status.paymentArrangement and the PaymentReady
          condition. Arrangements for the same account may not overlap in time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BillingArrangementSpec defines the desired state of a BillingArrangement.
            properties:
              billingAccountRef:
                description: |-
                  BillingAccountRef references the BillingAccount in the same
                  namespace that these terms apply to. Immutable.
                properties:
                  name:
                    description: Name is the name of the BillingAccount.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: billingAccountRef is immutable
                  rule: self == oldSelf
              endsAt:
                description: |-
                  EndsAt is when the arrangement stops applying. Leave unset for terms
                  with no fixed end. Staff end terms early by setting this to the
                  current time, which keeps the record for history.
                format: date-time
                type: string
              invoice:
                description: Invoice carries the invoice terms. Required when type
                  is Invoice.
                properties:
                  accountsPayableEmail:
                    description: |-
                      AccountsPayableEmail receives invoices in addition to the billing
                      contact. When unset, invoices go to the billing contact only.
                    maxLength: 254
                    type: string
                  agreementReference:
                    description: |-
                      AgreementReference identifies a signed MSA or order form, when one
                      exists. Without one, our standard terms of service apply.
                    maxLength: 128
                    type: string
                  creditLimit:
                    description: |-
                      CreditLimit is the maximum spend per billing cycle, as a decimal
                      string in the billing account's currency (e.g. "10000"). Staff are
                      alerted as the account nears it; it is not a hard cap.
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                    type: string
                  netDays:
                    default: 30
                    description: |-
                      NetDays is the number of days after the invoice date that payment
                      is due.
                    format: int32
                    maximum: 90
                    minimum: 1
                    type: integer
                  purchaseOrderNumber:
                    description: PurchaseOrderNumber is printed on invoices.
                    maxLength: 64
                    type: string
                required:
                - creditLimit
                type: object
              reason:
                description: |-
                  Reason records why staff granted these terms (for example "Signed
                  MSA, sales call 2026-10-01"). Internal: never shown to customers.
                maxLength: 1024
                minLength: 1
                type: string
              startsAt:
                description: |-
                  StartsAt is when the arrangement takes effect. Defaulted to the
                  time of creation when omitted.
                format: date-time
                type: string
              type:
                description: |-
                  Type selects how the account is billed. Immutable; to change type,
                  end this arrangement and create a new one.
                enum:
                - Invoice
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
            required:
            - billingAccountRef
            - reason
            - type
            type: object
            x-kubernetes-validations:
            - message: invoice is required when type is Invoice
              rule: self.type != 'Invoice' || has(self.invoice)
          status:
            description: |-
              BillingArrangementStatus defines the observed state of a
              BillingArrangement.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  arrangement's state. See BillingArrangementConditionActive.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              phase:
                description: Phase is where the arrangement sits in its validity window.
                enum:
                - Scheduled
                - Active
                - Ended
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
