---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Platform
  name: offers.billing.miloapis.com
spec:
  group: billing.miloapis.com
  names:
    kind: Offer
    listKind: OfferList
    plural: offers
    singular: offer
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.launchStage
      name: LaunchStage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Offer is the Schema for the offers API. A named, versioned bundle of
          service pricings (a "tier") that billing accounts are entitled to via
          BillingEntitlement.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OfferSpec defines the desired state of an Offer.

              An Offer bundles ServicePricings into a named, versioned tier. While
              Draft, the platform owner references ServicePricings by name via
              servicePricingRefs. On publish (launchStage=GA) the controller snapshots
              rates into servicePricings; afterward the Offer is immutable except for
              the kubernetes.io/display-name annotation.
            properties:
              chargeTypes:
                description: |-
                  ChargeTypes enumerates every charge type present in the referenced
                  (or snapshotted) pricings. Required so controllers can gate on
                  charge type explicitly.
                items:
                  description: ChargeType distinguishes how a ServicePricing is billed.
                  enum:
                  - Usage
                  - OneTime
                  - Recurring
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              launchStage:
                allOf:
                - enum:
                  - Draft
                  - GA
                - enum:
                  - Draft
                  - GA
                default: Draft
                description: |-
                  LaunchStage is the Offer lifecycle stage. Draft Offers are mutable
                  and not assignable; GA Offers are published and immutable except for
                  the display-name annotation.
                type: string
              servicePricingRefs:
                description: |-
                  ServicePricingRefs names the ServicePricing resources to include.
                  Authored while Draft; retained for audit after publish. Runtime
                  rating uses servicePricings only.
                items:
                  description: |-
                    ServicePricingRef names a ServicePricing resource referenced by an Offer
                    while in Draft. Namespace defaults to milo-system when omitted.
                  properties:
                    name:
                      description: Name is the metadata.name of the ServicePricing.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        Namespace is the namespace of the ServicePricing. Defaults to
                        milo-system when empty.
                      maxLength: 63
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              servicePricings:
                description: |-
                  ServicePricings is an immutable snapshot of referenced
                  ServicePricing specs, written by the controller when launchStage
                  first becomes GA. Empty while Draft.
                items:
                  description: |-
                    ServicePricingSnapshot is an immutable copy of a ServicePricingSpec taken
                    at Offer publish time, plus the source ServicePricing name.
                  properties:
                    name:
                      description: Name is the metadata.name of the source ServicePricing.
                      maxLength: 253
                      minLength: 1
                      type: string
                    spec:
                      description: Spec is a deep copy of the source ServicePricingSpec
                        at publish time.
                      properties:
                        amount:
                          description: |-
                            Amount is the fixed USD decimal string for OneTime and Recurring
                            charges.
                          pattern: ^(0|[1-9]\d*)(\.\d+)?$
                          type: string
                        chargeType:
                          description: ChargeType distinguishes Usage, OneTime, and
                            Recurring pricing.
                          enum:
                          - Usage
                          - OneTime
                          - Recurring
                          type: string
                        currency:
                          default: USD
                          description: Currency is the ISO 4217 currency code. USD
                            only in v1.
                          pattern: ^USD$
                          type: string
                        displayName:
                          description: DisplayName is a human-readable label for invoices
                            and portals.
                          maxLength: 128
                          type: string
                        interval:
                          description: Interval is the cadence for a Recurring charge.
                          enum:
                          - monthly
                          type: string
                        metric:
                          description: |-
                            Metric is the full metric name for Usage charges (e.g.
                            "compute.datumapis.com/instance/cpu-allocated"). Required when
                            chargeType is Usage.
                          maxLength: 253
                          type: string
                        pricingUnit:
                          description: |-
                            PricingUnit is a human-readable billing unit label (e.g. "vcpu",
                            "gib"). Required when chargeType is Usage. Does not need to be the
                            literal UCUM unit string of the meter.
                          maxLength: 64
                          type: string
                        rates:
                          description: |-
                            Rates is the ordered list of rate entries for Usage charges.
                            Required when chargeType is Usage.
                          items:
                            description: |-
                              PricingRate is a single rate entry. Exactly one of Flat or Tiered must
                              be set. An optional Match filters the rate by dimension value; the last
                              unmatched entry is the default catch-all.
                            properties:
                              flat:
                                description: |-
                                  Flat is a single decimal USD string multiplied by metered usage.
                                  Mutually exclusive with Tiered.
                                pattern: ^(0|[1-9]\d*)(\.\d+)?$
                                type: string
                              match:
                                description: Match optionally restricts this rate
                                  to a single dimension value.
                                properties:
                                  dimension:
                                    description: |-
                                      Dimension is the label key declared on the monitored resource type
                                      (e.g. "tier", "region", "model").
                                    maxLength: 63
                                    minLength: 1
                                    type: string
                                  value:
                                    description: Value is the dimension value this
                                      rate applies to.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                required:
                                - dimension
                                - value
                                type: object
                              tiered:
                                description: |-
                                  Tiered is an ordered list of graduated volume bands.
                                  Mutually exclusive with Flat.
                                items:
                                  description: |-
                                    PricingTierBand is a single graduated volume band. Aggregation for
                                    tier breaks is monthly at billing-account scope. Each band has a rate
                                    and an exclusive upper bound upTo in pricingUnit units. The last band
                                    omits upTo (open-ended).
                                  properties:
                                    rate:
                                      description: |-
                                        Rate is the USD decimal string applied to usage within this band.
                                        Zero ("0") is valid for free allowances.
                                      pattern: ^(0|[1-9]\d*)(\.\d+)?$
                                      type: string
                                    upTo:
                                      description: |-
                                        UpTo is the exclusive upper bound of this band in pricingUnit units.
                                        Omit on the last band for an open-ended range.
                                      pattern: ^(0|[1-9]\d*)(\.\d+)?$
                                      type: string
                                  required:
                                  - rate
                                  type: object
                                minItems: 1
                                type: array
                                x-kubernetes-list-type: atomic
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of flat or tiered must be set
                              rule: has(self.flat) != has(self.tiered)
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                        serviceRef:
                          description: |-
                            ServiceRef is the canonical service identifier (e.g.
                            "compute.datumapis.com").
                          maxLength: 253
                          minLength: 1
                          type: string
                        trigger:
                          description: Trigger identifies when a OneTime charge fires.
                          enum:
                          - BillingAccountActivation
                          type: string
                      required:
                      - chargeType
                      - currency
                      - serviceRef
                      type: object
                      x-kubernetes-validations:
                      - message: Usage ServicePricing requires metric, pricingUnit,
                          and rates
                        rule: self.chargeType != 'Usage' || (has(self.metric) && has(self.pricingUnit)
                          && has(self.rates))
                      - message: OneTime ServicePricing requires amount and trigger
                        rule: self.chargeType != 'OneTime' || (has(self.amount) &&
                          has(self.trigger))
                      - message: Recurring ServicePricing requires amount and interval
                        rule: self.chargeType != 'Recurring' || (has(self.amount)
                          && has(self.interval))
                  required:
                  - name
                  - spec
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - chargeTypes
            - launchStage
            type: object
          status:
            description: OfferStatus defines the observed state of an Offer.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  Offer's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              publishedAt:
                description: |-
                  PublishedAt is the time at which the controller first observed the
                  Offer in the GA launch stage with a complete snapshot.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
