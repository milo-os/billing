---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Organization
  name: paymentmethodsetups.billing.miloapis.com
spec:
  group: billing.miloapis.com
  names:
    kind: PaymentMethodSetup
    listKind: PaymentMethodSetupList
    plural: paymentmethodsetups
    singular: paymentmethodsetup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.billingAccountRef.name
      name: Account
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.setupIntentId
      name: SetupIntent
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PaymentMethodSetup is the Schema for the paymentmethodsetups API. It
          represents an in-flight payment-method onboarding for a BillingAccount.
          Clients create one of these, then poll `.status.clientSecret` to drive
          Stripe Elements in the browser.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PaymentMethodSetupSpec defines the desired state of a PaymentMethodSetup.

              Spec is effectively immutable once the controller has created an upstream
              SetupIntent: re-binding fields would orphan the upstream resource. To
              retry a failed setup, create a new PaymentMethodSetup.
            properties:
              billingAccountRef:
                description: |-
                  BillingAccountRef references the BillingAccount this setup belongs
                  to. The BillingAccount is the owner of the resulting PaymentMethod.
                properties:
                  name:
                    description: Name is the name of the BillingAccount.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              returnURL:
                description: |-
                  ReturnURL is an optional URL that Stripe will redirect the browser
                  to after 3DS authentication completes. When unset, the front-end
                  is expected to handle the in-page result without a redirect.
                type: string
            required:
            - billingAccountRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: PaymentMethodSetupStatus defines the observed state of a
              PaymentMethodSetup.
            properties:
              clientSecret:
                description: |-
                  ClientSecret is the Stripe SetupIntent client_secret value. The
                  browser uses this with Stripe Elements to confirm the setup. The
                  value is single-use and short-lived.
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  setup's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: FailureMessage is a human-readable description of the
                  failure.
                type: string
              failureReason:
                description: |-
                  FailureReason is a short, machine-parseable code for the failure
                  (e.g. `card_declined`). Set when phase is Failed.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              phase:
                description: Phase represents the current lifecycle phase of the setup.
                enum:
                - Pending
                - ClientSecretReady
                - Succeeded
                - Failed
                type: string
              providerName:
                description: |-
                  ProviderName is the name of the PaymentProvider that fulfilled
                  this setup.
                type: string
              publishableKey:
                description: |-
                  PublishableKey is the public Stripe publishable key for the
                  provider that issued this setup. Surfaced here so the browser can
                  bootstrap Stripe Elements from a single resource read.
                type: string
              setupIntentId:
                description: |-
                  SetupIntentID is the upstream identifier of the SetupIntent
                  (e.g. `seti_…` for Stripe).
                type: string
              setupIntentStatus:
                description: |-
                  SetupIntentStatus is the most recent upstream status of the
                  SetupIntent (e.g. `requires_payment_method`, `succeeded`).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
