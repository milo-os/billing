namespace: billing-system

images:
  - name: ghcr.io/milo-os/billing
    newTag: dev

resources:
  - ../../base/crd
  - ../../base/manager
  - ../../base/certmanager
  - ../../base/gateway

components:
  - ../../components/namespace
  - ../../base/webhook
  - ../../components/controller_rbac

configMapGenerator:
  - name: billing-config
    behavior: replace
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true

patches:
  - path: dev_patch.yaml
  # We use JSON patches for volume removal because Strategic Merge Patches
  # can sometimes clear the entire volumeMounts list instead of just deleting
  # the targeted item. These surgical removals ensure the nats-certs (index 2)
  # are removed while keeping the critical /config and webhook certs.
  - target:
      kind: Deployment
      name: billing-controller-manager
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/2
      - op: remove
        path: /spec/template/spec/volumes/2
  - target:
      kind: Certificate
      name: billing-serving-cert
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - billing-webhook.billing-system.svc
          - billing-webhook.billing-system.svc.cluster.local
  - target:
      kind: Deployment
      name: billing-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: billing-gateway
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1

replacements:
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: billing-serving-cert
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: billing-serving-cert
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
