name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      skip: docker,test
      run: |
        mkdir -p internal/controller/testdata/crd
        curl -sfL "https://raw.githubusercontent.com/milo-os/milo/refs/tags/v0.36.9/config/crd/bases/resourcemanager/resourcemanager.miloapis.com_projects.yaml" \
          -o internal/controller/testdata/crd/resourcemanager.miloapis.com_projects.yaml
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@32759fab31191897ae86091d8831b2d4b890aedd
        KUBEBUILDER_ASSETS="$(setup-envtest use 1.31.0 -p path)" go test ./... -timeout 10m
