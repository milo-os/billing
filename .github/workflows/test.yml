name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23

      - name: Fetch external CRDs
        run: |
          mkdir -p internal/controller/testdata/crd
          curl -sfL "https://raw.githubusercontent.com/milo-os/milo/refs/tags/v0.36.9/config/crd/bases/resourcemanager/resourcemanager.miloapis.com_projects.yaml" \
            -o internal/controller/testdata/crd/resourcemanager.miloapis.com_projects.yaml

      - name: Running Tests
        run: |
          KUBEBUILDER_ASSETS="$(setup-envtest use 1.31.0 -p path)" go test -timeout 5m ./...
