name: Publish Docker Image

on:
  push:
  release:
    types: ['published']

jobs:
  publish-container-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: billing
      registry-organization: milo-os
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # The bundle pins the image tag, and Flux rolls out new bundles within a
  # minute of publishing. Publish it only after the image exists so pods never
  # roll out against a tag that has not been pushed yet.
  publish-kustomize-bundles:
    needs: publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/billing-kustomize
      bundle-path: config
      image-overlays: config/base/manager,config/base/gateway,config/components/usage-generator,config/components/mcp-server
      image-name: ghcr.io/milo-os/billing
    secrets: inherit
