name: Provider UI plugin

on:
  pull_request:
    paths:
      - ui/provider/**
      - .github/workflows/ui-provider.yaml
  push:
    branches: [main]
    paths:
      - ui/provider/**
      - .github/workflows/ui-provider.yaml

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ui/provider
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json's packageManager; Node's from
      # .nvmrc. Both are enforced on install (engines, devEngines).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/provider/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/provider/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/provider/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
