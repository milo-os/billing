name: Activity Policy Tests

# Validates billing's ActivityPolicies and runs their unit tests
# (test/activity-policies) in the activitytool image. Run the same check
# locally with `task test:activity-policies`.

on:
  pull_request:
    paths:
      - "config/components/activity-policies/**"
      - "test/activity-policies/**"
      - ".github/workflows/activity-policies.yaml"
  push:
    branches: [main]
    paths:
      - "config/components/activity-policies/**"
      - "test/activity-policies/**"
      - ".github/workflows/activity-policies.yaml"

permissions:
  contents: read

jobs:
  test-activity-policies:
    permissions:
      contents: read
    uses: datum-cloud/actions/.github/workflows/test-activity-policies.yaml@v1.29.0
    with:
      # The milo-os/activity release deployed where these policies run. Keep in
      # sync with ACTIVITYTOOL_VERSION in Taskfile.yaml.
      # renovate: datasource=docker depName=ghcr.io/milo-os/activitytool
      activitytool-version: v0.10.1@sha256:9efcfff21f2533919a8a43bb49ab1a6fa2e29edd9cb665e34574428c490389c3
      policies-path: config/components/activity-policies
      tests-path: test/activity-policies
      fail-on-untested: true
