  exp_rule: attached
  exp_summary: Payment method card-1 was added to billing account acme and is ready to use
- name: failed with a reason
  event:
    metadata:
      name: card-1.18a1
      namespace: organization-acme
      annotations:
        platform.miloapis.com/scope.type: Organization
        platform.miloapis.com/scope.name: acme
        event.billing.miloapis.com/billing-account: acme
        event.billing.miloapis.com/decline-reason: InsufficientFunds
    involvedObject:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    regarding:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    reason: PaymentMethodFailed
    type: Normal
    message: fallback message
    source:
      component: billing-controller
  exp_rule: failed
  exp_summary: 'Payment method card-1 could not be added to billing account acme: the card was declined (insufficient funds)'
- name: failed with an unknown reason
  event:
    metadata:
      name: card-1.18a1
      namespace: organization-acme
      annotations:
        platform.miloapis.com/scope.type: Organization
        platform.miloapis.com/scope.name: acme
        event.billing.miloapis.com/billing-account: acme
        event.billing.miloapis.com/decline-reason: generic_decline
    involvedObject:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    regarding:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    reason: PaymentMethodFailed
    type: Normal
    message: fallback message
    source:
      component: billing-controller
  exp_rule: failed
  exp_summary: 'Payment method card-1 could not be added to billing account acme: the card was declined'
- name: failed without a reason
