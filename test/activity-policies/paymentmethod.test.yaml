# PaymentMethod: users adding payment methods, and cards attached, failing,
# expiring and expired, with and without their detail annotations.
policy_files:
- ../../config/components/activity-policies
tests:
- name: a user adds a payment method with a display name
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: billing.miloapis.com
      resource: paymentmethods
      name: card-1
      namespace: organization-acme
    requestURI: /apis/billing.miloapis.com/v1alpha1/namespaces/organization-acme/paymentmethods/card-1
    responseStatus:
      code: 201
    requestObject:
      spec:
        displayName: Company Visa
    responseObject:
      metadata:
        name: card-1
        namespace: organization-acme
      spec: {}
  exp_rule: create-with-display-name
  exp_summary: alice@example.com added payment method Company Visa
- name: a user adds a payment method without a display name
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: billing.miloapis.com
      resource: paymentmethods
      name: card-1
      namespace: organization-acme
    requestURI: /apis/billing.miloapis.com/v1alpha1/namespaces/organization-acme/paymentmethods/card-1
    responseStatus:
      code: 201
    requestObject:
      spec: {}
    responseObject:
      metadata:
        name: card-1
        namespace: organization-acme
      spec: {}
  exp_rule: create-fallback
  exp_summary: alice@example.com added payment method card-1
- name: attached card links the card and the billing account
  event:
    metadata:
      name: card-1.18a1
      namespace: organization-acme
      annotations:
        platform.miloapis.com/scope.type: Organization
        platform.miloapis.com/scope.name: acme
        event.billing.miloapis.com/billing-account: acme
        event.billing.miloapis.com/card-brand: visa
        event.billing.miloapis.com/card-last4: '4242'
        event.billing.miloapis.com/card-expiry: '2026-11-01T00:00:00Z'
    involvedObject:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    regarding:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    reason: PaymentMethodAttached
    type: Normal
    message: fallback message
    source:
      component: billing-controller
  exp_rule: attached-card
  exp_summary: Visa ending 4242 was added to billing account acme and is ready to use
  exp_policy: billing.miloapis.com-paymentmethod
  exp_links:
  - marker: Visa ending 4242
    apiGroup: billing.miloapis.com
    namespace: organization-acme
    name: card-1
  - marker: acme
    apiGroup: billing.miloapis.com
    namespace: organization-acme
    name: acme
- name: attached card of an unlisted brand
  event:
    metadata:
      name: card-1.18a1
      namespace: organization-acme
      annotations:
        platform.miloapis.com/scope.type: Organization
        platform.miloapis.com/scope.name: acme
        event.billing.miloapis.com/billing-account: acme
        event.billing.miloapis.com/card-brand: elo
        event.billing.miloapis.com/card-last4: '4242'
        event.billing.miloapis.com/card-expiry: '2026-11-01T00:00:00Z'
    involvedObject:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    regarding:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    reason: PaymentMethodAttached
    type: Normal
    message: fallback message
    source:
      component: billing-controller
  exp_rule: attached-card
  exp_summary: Card ending 4242 was added to billing account acme and is ready to use
- name: attached without card detail
  event:
    metadata:
      name: card-1.18a1
      namespace: organization-acme
      annotations:
        platform.miloapis.com/scope.type: Organization
        platform.miloapis.com/scope.name: acme
        event.billing.miloapis.com/billing-account: acme
    involvedObject:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
      name: card-1
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    regarding:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: PaymentMethod
