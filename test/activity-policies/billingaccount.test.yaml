    responseStatus:
      code: 200
    requestObject:
      metadata:
        annotations:
          billing.miloapis.com/display-name: Acme production
      spec:
        contactInfo:
          email: billing@acme.example
          invoiceEmails:
          - finance@acme.example
    responseObject:
      metadata:
        name: acme
        namespace: organization-acme
      spec: {}
      status: {}
  exp_rule: update-billing-details
