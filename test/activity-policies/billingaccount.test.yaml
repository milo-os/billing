      spec:
        contactInfo:
          email: billing@acme.example
          name: null
          businessName: Acme Ltd
          invoiceEmails: []
          address:
            country: GB
            city: London
        taxIds:
        - type: gb_vat
          value: GB123456789
    responseObject:
      metadata:
        name: acme
        namespace: organization-acme
      spec: {}
      status: {}
  exp_rule: update-billing-details
  exp_summary: staff@example.com updated the billing details for billing account acme
- name: the cloud portal saves billing details with the display name
