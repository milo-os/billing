      name: acme-terms.18a1
      namespace: organization-acme
      annotations:
        platform.miloapis.com/scope.type: Organization
        platform.miloapis.com/scope.name: acme
        event.billing.miloapis.com/billing-account: acme
        event.billing.miloapis.com/ends-at: '2027-09-30T00:00:00Z'
    involvedObject:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: BillingArrangement
      name: acme-terms
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    regarding:
      apiVersion: billing.miloapis.com/v1alpha1
      kind: BillingArrangement
      name: acme-terms
      namespace: organization-acme
      uid: 3f0c6a1e-0000-4000-8000-000000000001
    reason: PaymentTermsEnded
    type: Normal
    message: fallback message
    source:
      component: billing-controller
  exp_rule: terms-ended
  exp_summary: Payment terms for billing account acme ended on 30 September 2027
  exp_change_source: system
- name: terms ended event without its detail
