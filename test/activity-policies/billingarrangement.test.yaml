    responseStatus:
      code: 201
    responseObject:
      metadata:
        name: acme-terms
        namespace: organization-acme
      spec:
        billingAccountRef:
          name: acme
        type: Invoice
        invoice:
          netDays: 30
        startsAt: '2026-10-06T10:00:00Z'
        reason: Internal note that must never appear
        applicationRef: &id001
          name: acme-apply
    requestReceivedTimestamp: '2026-10-06T10:00:00.123456Z'
  exp_summary: 'alice@example.com approved the payment terms application acme-apply with invoice terms for billing account
    acme: net 30'
