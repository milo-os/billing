      spec:
        billingAccountRef:
          name: acme
        type: Invoice
        invoice:
          netDays: 30
          creditLimit: '10000'
          purchaseOrderNumber: PO-4471
        startsAt: '2026-11-01T00:00:00Z'
        reason: Internal note that must never appear
        endsAt: '2027-09-30T00:00:00Z'
    requestReceivedTimestamp: '2026-10-06T10:00:00.123456Z'
  exp_summary: 'alice@example.com granted invoice terms to billing account acme: net 30, credit limit 10000, PO PO-4471, starting
    1 November 2026, until 30 September 2027'
- name: grant terms without a credit limit
  audit:
