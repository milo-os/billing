apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: e2e-bac-cpu-allocated
  labels:
    # Set by service-catalog's meter fan-out; a Usage ServicePricing's
    # serviceRef must match it.
    services.miloapis.com/service: compute.datumapis.com
spec:
  meterName: e2e.billing.miloapis.com/billing-account-contract/cpu-allocated
  displayName: E2E Contract CPU Allocated
  description: E2E fixture for the usage a contract bills on top of its fees.
  phase: Published
  measurement:
    aggregation: Average
    unit: "{vcpu}"
  billing:
    consumedUnit: "{vcpu}"
  monitoredResourceTypes:
    - instance
