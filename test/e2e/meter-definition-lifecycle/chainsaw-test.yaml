apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: meter-definition-lifecycle
spec:
  description: |
    Tests the MeterDefinition lifecycle including:
    - Creating a meter transitions to Ready=True
    - Webhook rejects attempts to change immutable fields (meterName)
    - Webhook rejects removing declared dimensions
    - displayName, description, and dimension additions are permitted

  steps:
    - name: create-meter
      description: Create a MeterDefinition. Should become Ready.
      try:
        - create:
            file: 01-create-meter.yaml
        - assert:
            timeout: 30s
            file: assertions/assert-ready.yaml

    - name: reject-change-meter-name
      description: Verify that meterName cannot be changed after create (immutability).
      try:
        - apply:
            file: test-data/change-meter-name.yaml
            expect:
              - check:
                  ($error != null): true

    - name: reject-remove-dimension
      description: Verify that removing a declared dimension is rejected.
      try:
        - apply:
            file: test-data/remove-dimension.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'dimensions')): true

    - name: edit-editable-fields
      description: displayName, description, and added dimensions are permitted.
      try:
        - apply:
            file: 02-edit-editable-fields.yaml
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: e2e-compute-cpu-seconds
              spec:
                displayName: Compute Instance CPU Time (Updated)
                measurement:
                  dimensions:
                    - region
                    - instance.type
                    - resource.tier

    - name: reject-immutable-fields
      description: Verify aggregation, unit, consumedUnit, and pricingUnit immutability.
      try:
        - script:
            content: |
              if kubectl patch meterdefinition e2e-compute-cpu-seconds -n $NAMESPACE --type=merge --patch '{"spec":{"measurement":{"aggregation":"Max"}}}' 2>&1 | grep -q "aggregation is immutable"; then
                echo "Rejected aggregation update as expected"
              else
                echo "Error: Did not reject aggregation update" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch meterdefinition e2e-compute-cpu-seconds -n $NAMESPACE --type=merge --patch '{"spec":{"measurement":{"unit":"minutes"}}}' 2>&1 | grep -q "unit is immutable"; then
                echo "Rejected unit update as expected"
              else
                echo "Error: Did not reject unit update" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch meterdefinition e2e-compute-cpu-seconds -n $NAMESPACE --type=merge --patch '{"spec":{"billing":{"consumedUnit":"minutes"}}}' 2>&1 | grep -q "consumedUnit is immutable"; then
                echo "Rejected consumedUnit update as expected"
              else
                echo "Error: Did not reject consumedUnit update" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch meterdefinition e2e-compute-cpu-seconds -n $NAMESPACE --type=merge --patch '{"spec":{"billing":{"pricingUnit":"minutes"}}}' 2>&1 | grep -q "pricingUnit is immutable"; then
                echo "Rejected pricingUnit update as expected"
              else
                echo "Error: Did not reject pricingUnit update" >&2
                exit 1
              fi

    - name: verify-phase-transitions
      description: Verify forward-only phase transitions (Draft -> Published -> Deprecated -> Retired).
      try:
        - script:
            content: |
              if kubectl patch meterdefinition e2e-compute-cpu-seconds -n $NAMESPACE --type=merge --patch '{"spec":{"phase":"Draft"}}' 2>&1 | grep -q "invalid phase transition"; then
                echo "Rejected backward transition as expected"
              else
                echo "Error: Did not reject backward phase transition" >&2
                exit 1
              fi
        - script:
            content: |
              kubectl patch meterdefinition e2e-compute-cpu-seconds -n $NAMESPACE --type=merge --patch '{"spec":{"phase":"Deprecated"}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: e2e-compute-cpu-seconds
              spec:
                phase: Deprecated
        - script:
            content: |
              kubectl patch meterdefinition e2e-compute-cpu-seconds -n $NAMESPACE --type=merge --patch '{"spec":{"phase":"Retired"}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: e2e-compute-cpu-seconds
              spec:
                phase: Retired


