apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ownership-webhook
spec:
  description: |
    Tests the MeterDefinition and MonitoredResourceType ownership webhook rules:
    - Webhook rejects creating resources with app.kubernetes.io/managed-by: services-operator label by normal users.
    - Webhook allows services-operator service account to create them.
    - Webhook rejects updates and deletions of these resources by normal users.
    - Webhook allows updates and deletions by services-operator service account.
  steps:
    - name: setup-rbac
      description: Create ClusterRole and ClusterRoleBinding for services-operator.
      try:
        - create:
            file: 00-rbac.yaml

    - name: reject-creation-by-admin
      description: Verify that a normal user (admin) cannot create resources with the services-operator label.
      try:
        - apply:
            file: 01-resources.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'resource is managed by the services operator')): true

    - name: create-by-services-operator
      description: Create the resources using the impersonated services-operator service account.
      try:
        - script:
            content: |
              kubectl apply -f 01-resources.yaml --as=system:serviceaccount:services-system:services-operator
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: ownership-test-md
              spec:
                displayName: Compute Instance CPU Time (Ownership)
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MonitoredResourceType
              metadata:
                name: ownership-test-mrt
              spec:
                displayName: Monitored Resource (Ownership)

    - name: reject-update-by-admin
      description: Verify that normal users cannot update resources managed by services-operator.
      try:
        - script:
            content: |
              if kubectl patch meterdefinition ownership-test-md --type=merge --patch '{"spec":{"displayName":"Updated by admin"}}' 2>&1 | grep -q "resource is managed by the services operator"; then
                echo "Rejected MD update as expected"
              else
                echo "Error: Did not reject MD update" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch monitoredresourcetype ownership-test-mrt --type=merge --patch '{"spec":{"displayName":"Updated by admin"}}' 2>&1 | grep -q "resource is managed by the services operator"; then
                echo "Rejected MRT update as expected"
              else
                echo "Error: Did not reject MRT update" >&2
                exit 1
              fi

    - name: reject-delete-by-admin
      description: Verify that normal users cannot delete resources managed by services-operator.
      try:
        - script:
            content: |
              if kubectl delete meterdefinition ownership-test-md 2>&1 | grep -q "resource is managed by the services operator"; then
                echo "Rejected MD deletion as expected"
              else
                echo "Error: Did not reject MD deletion" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl delete monitoredresourcetype ownership-test-mrt 2>&1 | grep -q "resource is managed by the services operator"; then
                echo "Rejected MRT deletion as expected"
              else
                echo "Error: Did not reject MRT deletion" >&2
                exit 1
              fi

    - name: update-by-services-operator
      description: Verify that services-operator service account can update these resources.
      try:
        - script:
            content: |
              kubectl patch meterdefinition ownership-test-md --as=system:serviceaccount:services-system:services-operator --type=merge --patch '{"spec":{"displayName":"Updated by operator"}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: ownership-test-md
              spec:
                displayName: Updated by operator
        - script:
            content: |
              kubectl patch monitoredresourcetype ownership-test-mrt --as=system:serviceaccount:services-system:services-operator --type=merge --patch '{"spec":{"displayName":"Updated by operator"}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MonitoredResourceType
              metadata:
                name: ownership-test-mrt
              spec:
                displayName: Updated by operator

    - name: delete-by-services-operator
      description: Verify that services-operator service account can delete these resources.
      try:
        - script:
            content: |
              kubectl delete meterdefinition ownership-test-md --as=system:serviceaccount:services-system:services-operator
              kubectl delete monitoredresourcetype ownership-test-mrt --as=system:serviceaccount:services-system:services-operator
        - error:
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: ownership-test-md
        - error:
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MonitoredResourceType
              metadata:
                name: ownership-test-mrt

    - name: cleanup-rbac
      description: Delete ClusterRole and ClusterRoleBinding for services-operator.
      try:
        - delete:
            ref:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              name: services-operator-impersonation-binding
        - delete:
            ref:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              name: services-operator-impersonation-role

