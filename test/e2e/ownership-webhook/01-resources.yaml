apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: ownership-test-md
  labels:
    app.kubernetes.io/managed-by: services-operator
spec:
  meterName: compute.miloapis.com/instance/cpu-seconds-ownership
  displayName: Compute Instance CPU Time (Ownership)
  phase: Published
  measurement:
    aggregation: Sum
    unit: s
  billing:
    consumedUnit: s
    pricingUnit: h
  monitoredResourceTypes:
    - ownership-test-mrt
---
apiVersion: billing.miloapis.com/v1alpha1
kind: MonitoredResourceType
metadata:
  name: ownership-test-mrt
  labels:
    app.kubernetes.io/managed-by: services-operator
spec:
  resourceTypeName: ownership-test-mrt
  displayName: Monitored Resource (Ownership)
  phase: Published
  gvk:
    group: compute.miloapis.com
    kind: Instance
