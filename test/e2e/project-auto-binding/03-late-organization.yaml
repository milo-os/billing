# The project exists first; its organization's account comes after.
apiVersion: v1
kind: Namespace
metadata:
  name: organization-e2e-autobind-late
---
apiVersion: resourcemanager.miloapis.com/v1alpha1
kind: Project
metadata:
  name: autobind-late
spec:
  ownerRef:
    kind: Organization
    name: e2e-autobind-late
---
apiVersion: billing.miloapis.com/v1alpha1
kind: BillingAccount
metadata:
  name: autobind-late-account
  namespace: organization-e2e-autobind-late
spec:
  currencyCode: USD
