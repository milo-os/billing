apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: usage-pipeline
spec:
  concurrent: false
  description: |
    Full E2E workflow for the usage pipeline:
    1. Create MeterDefinitions, BillingAccounts, and Bindings.
    2. Send a valid event to billing-usage-collector (mimicking emission SDK).
    3. Assert the event is attributed and reaches the .valid JetStream subject.
    4. Send an invalid event (unknown meter).
    5. Assert the event reaches the .quarantine.unknown_meter subject.
  steps:
    - name: setup
      description: |
        Purge the NATS stream and clear the Vector agent's buffer/backoff state
        to ensure a clean slate for the test run.
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              
              # Purge NATS stream
              NATS_POD=$(kubectl get pod -n nats-system -l app.kubernetes.io/component=nats-box --no-headers -o name | head -1)
              kubectl exec -n nats-system "$NATS_POD" -- \
                nats --server nats://nats:4222 \
                stream purge billing-usage --force 2>/dev/null
              echo "NATS stream purged"

              # Clear Vector persistent buffer
              VECTOR_POD=$(kubectl get pod -n billing-system -l app.kubernetes.io/instance=billing-usage-collector --no-headers -o name | head -1)
              if [ -n "$VECTOR_POD" ]; then
                kubectl exec -n billing-system "$VECTOR_POD" -- rm -rf /vector-data-dir/buffer
                echo "Vector buffer cleared"
                
                # Restart Vector to reset backoff state and start clean
                kubectl rollout restart ds/billing-usage-collector-vector -n billing-system
                kubectl rollout status ds/billing-usage-collector-vector -n billing-system --timeout=30s
                echo "Vector agent restarted"
              fi

    - name: create-resources
      try:
        - apply:
            file: resources.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: e2e-account
                namespace: usage-pipeline-test
              status:
                phase: Ready
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccountBinding
              metadata:
                name: e2e-binding
                namespace: usage-pipeline-test
              status:
                phase: Active

    - name: send-valid-event
      description: |
        Send a valid event to billing-usage-collector.
        Project: projects/p-e2e-usage-pipeline
      try:
        - script:
            timeout: 30s
            content: |
              set -eu
              
              # Give the gateway a moment to sync its cache of the new resources
              sleep 5

              # Generate a unique ULID (26 chars: 10 timestamp + 16 randomness)
              # We use a fixed prefix to ensure it's valid Crockford's Base32.
              export LC_ALL=C
              VALID_ID="01HVJ$(head -c 500 /dev/urandom | tr -dc '0123456789ABCDEFGHJKMNPQRSTVWXYZ' | head -c 21)"
              echo "Generated Valid ID: $VALID_ID"
              echo "$VALID_ID" > /tmp/valid_id.txt

              VECTOR_POD=$(kubectl get pod -n billing-system -l app.kubernetes.io/instance=billing-usage-collector --no-headers -o name | head -1)
              echo '{"specversion":"1.0","type":"e2e-cpu-seconds","source":"/e2e/test","subject":"projects/p-e2e-usage-pipeline","id":"'"$VALID_ID"'","time":"2026-05-06T11:00:00Z","datacontenttype":"application/json","data":{"value":"100","dimensions":{"region":"us-west-1","zone":"us-west-1a"}}}' > event.json
              kubectl cp event.json -n billing-system "${VECTOR_POD#pod/}:/tmp/event.json"
              kubectl exec -n billing-system "$VECTOR_POD" -- \
                wget -q -O- \
                  --header="Content-Type: application/cloudevents+json" \
                  --post-file=/tmp/event.json \
                  http://127.0.0.1:9880/cloudevents

    - name: wait-for-gateway-batch
      description: |
        The Gateway batches events before processing. Wait for the batch to flush
        so the consumer has something to process before we assert.
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              echo "Waiting 30s for Gateway event batch to flush..."
              sleep 5
              echo "Done waiting"

    - name: assert-valid-event-attributed
      description: |
        Verify that the event reached the billing.usage.p-e2e-usage-pipeline.valid subject.
      try:
        - script:
            timeout: 60s
            content: |
              set -eu
              VALID_ID=$(cat /tmp/valid_id.txt)
              NATS_POD=$(kubectl get pod -n nats-system -l app.kubernetes.io/component=nats-box --no-headers -o name | head -1)

              DEADLINE=$(($(date +%s) + 55))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                MSG=$(kubectl exec -n nats-system "$NATS_POD" -- \
                  nats --server nats://nats:4222 \
                  sub --all -T --stream billing-usage \
                  "billing.usage.p-e2e-usage-pipeline.valid" \
                  2>/dev/null || true)
                if echo "$MSG" | grep -q "$VALID_ID"; then
                  echo "SUCCESS: event $VALID_ID found in valid queue"
                  echo "$MSG" | grep "$VALID_ID" | grep "^{" | head -n 1 > /tmp/valid_pipeline_event.json
                  exit 0
                fi
                echo "Waiting for event $VALID_ID..."
                sleep 2
              done
              echo "FAIL: event $VALID_ID did not reach valid queue" >&2
              exit 1

        # check billing account ref
        - script:
            timeout: 15s
            content: |
              set -eu
              python3 -c 'import json; d = json.load(open("/tmp/valid_pipeline_event.json")); val = d.get("billingaccountref"); assert val == "e2e-account", f"Expected e2e-account, got {val}"'
              echo "SUCCESS: billingAccountRef verified"

        # check dimensions
        - script:
            timeout: 15s
            content: |
              set -eu
              python3 -c 'import json; d = json.load(open("/tmp/valid_pipeline_event.json")); dims = d.get("data", {}).get("dimensions", {}); r, z, p = dims.get("region"), dims.get("zone"), dims.get("project_name"); assert r == "us-west-1", f"Expected region=us-west-1, got {r}"; assert z == "us-west-1a", f"Expected zone=us-west-1a, got {z}"; assert p == "p-e2e-usage-pipeline", f"Expected project_name=p-e2e-usage-pipeline, got {p}"'
              echo "SUCCESS: dimensions verified (region, zone, project_name)"

    - name: send-invalid-event
      description: |
        Send an invalid event (unknown meter) to billing-usage-collector.
      try:
        - script:
            timeout: 30s
            content: |
              set -eu
              export LC_ALL=C
              INVALID_ID="01HVJ$(head -c 500 /dev/urandom | tr -dc '0123456789ABCDEFGHJKMNPQRSTVWXYZ' | head -c 21)"
              echo "Generated Invalid ID: $INVALID_ID"
              echo "$INVALID_ID" > /tmp/invalid_id.txt

              VECTOR_POD=$(kubectl get pod -n billing-system -l app.kubernetes.io/instance=billing-usage-collector --no-headers -o name | head -1)
              echo '{"specversion":"1.0","type":"non-existent-meter","source":"/e2e/test","subject":"projects/p-e2e-usage-pipeline","id":"'"$INVALID_ID"'","time":"2026-05-06T11:00:00Z","datacontenttype":"application/json","data":{"value":"100"}}' > invalid_event.json
              kubectl cp invalid_event.json -n billing-system "${VECTOR_POD#pod/}:/tmp/invalid_event.json"
              kubectl exec -n billing-system "$VECTOR_POD" -- \
                wget -q -O- \
                  --header="Content-Type: application/cloudevents+json" \
                  --post-file=/tmp/invalid_event.json \
                  http://127.0.0.1:9880/cloudevents

    - name: wait-for-gateway-batch-2
      description: |
        Wait for the Gateway to batch and process the invalid event.
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              echo "Waiting 30s for Gateway event batch to flush..."
              sleep 5
              echo "Done waiting"

    - name: assert-event-quarantined
      description: |
        Verify that the event reached the billing.usage.p-e2e-usage-pipeline.quarantine.unknown_meter subject.
      try:
        # check quarantine unknown meter subject
        - script:
            timeout: 60s
            content: |
              set -eu
              INVALID_ID=$(cat /tmp/invalid_id.txt)
              NATS_POD=$(kubectl get pod -n nats-system -l app.kubernetes.io/component=nats-box --no-headers -o name | head -1)

              DEADLINE=$(($(date +%s) + 55))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                MSG=$(kubectl exec -n nats-system "$NATS_POD" -- \
                  nats --server nats://nats:4222 \
                  sub --all -T --stream billing-usage \
                  --timeout 1s \
                  "billing.usage.p-e2e-usage-pipeline.quarantine.unknown_meter" \
                  2>/dev/null || true)
                if echo "$MSG" | grep -q "$INVALID_ID"; then
                  echo "SUCCESS: event $INVALID_ID found in quarantine queue"
                  exit 0
                fi
                echo "Waiting for event $INVALID_ID in quarantine..."
                sleep 2
              done
              echo "FAIL: event $INVALID_ID did not reach quarantine" >&2
              exit 1

    - name: send-invalid-dimension-event
      description: |
        Send an event with an undeclared dimension key ("invalidDim") to billing-usage-collector.
      try:
        - script:
            timeout: 30s
            content: |
              set -eu
              export LC_ALL=C
              INVDIM_ID="01HVJ$(head -c 500 /dev/urandom | tr -dc '0123456789ABCDEFGHJKMNPQRSTVWXYZ' | head -c 21)"
              echo "Generated Invalid Dimension Event ID: $INVDIM_ID"
              echo "$INVDIM_ID" > /tmp/invalid_dimension_id.txt

              VECTOR_POD=$(kubectl get pod -n billing-system -l app.kubernetes.io/instance=billing-usage-collector --no-headers -o name | head -1)
              echo '{"specversion":"1.0","type":"e2e-cpu-seconds","source":"/e2e/test","subject":"projects/p-e2e-usage-pipeline","id":"'"$INVDIM_ID"'","time":"2026-05-06T11:00:00Z","datacontenttype":"application/json","data":{"value":"100","dimensions":{"region":"us-west-1","zone":"us-west-1a","invalidDim":"oops"}}}' > invalid_dimension_event.json
              kubectl cp invalid_dimension_event.json -n billing-system "${VECTOR_POD#pod/}:/tmp/invalid_dimension_event.json"
              kubectl exec -n billing-system "$VECTOR_POD" -- \
                wget -q -O- \
                  --header="Content-Type: application/cloudevents+json" \
                  --post-file=/tmp/invalid_dimension_event.json \
                  http://127.0.0.1:9880/cloudevents

    - name: wait-for-gateway-batch-3
      description: |
        Wait for the Gateway to batch and process the invalid dimension event.
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              echo "Waiting 30s for Gateway event batch to flush..."
              sleep 5
              echo "Done waiting"

    - name: assert-invalid-dimension-event-quarantined
      description: |
        Verify that the event reached the billing.usage.p-e2e-usage-pipeline.quarantine.invalid_dimensions subject.
      try:
        - script:
            timeout: 60s
            content: |
              set -eu
              INVDIM_ID=$(cat /tmp/invalid_dimension_id.txt)
              NATS_POD=$(kubectl get pod -n nats-system -l app.kubernetes.io/component=nats-box --no-headers -o name | head -1)

              DEADLINE=$(($(date +%s) + 55))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                MSG=$(kubectl exec -n nats-system "$NATS_POD" -- \
                  nats --server nats://nats:4222 \
                  sub --all -T --stream billing-usage \
                  --timeout 1s \
                  "billing.usage.p-e2e-usage-pipeline.quarantine.invalid_dimensions" \
                  2>/dev/null || true)
                if echo "$MSG" | grep -q "$INVDIM_ID"; then
                  echo "SUCCESS: event $INVDIM_ID found in quarantine queue"
                  exit 0
                fi
                echo "Waiting for event $INVDIM_ID in quarantine..."
                sleep 2
              done
              echo "FAIL: event $INVDIM_ID did not reach quarantine" >&2
              exit 1

    - name: send-attribution-failure-event
      description: |
        Send a valid event format for a project with no active binding ("p-e2e-usage-pipeline-noattr") to trigger attribution_failure.
      try:
        - script:
            timeout: 30s
            content: |
              set -eu
              export LC_ALL=C
              NOATTR_ID="01HVJ$(head -c 500 /dev/urandom | tr -dc '0123456789ABCDEFGHJKMNPQRSTVWXYZ' | head -c 21)"
              echo "Generated Attribution Failure Event ID: $NOATTR_ID"
              echo "$NOATTR_ID" > /tmp/noattr_id.txt

              VECTOR_POD=$(kubectl get pod -n billing-system -l app.kubernetes.io/instance=billing-usage-collector --no-headers -o name | head -1)
              echo '{"specversion":"1.0","type":"e2e-cpu-seconds","source":"/e2e/test","subject":"projects/p-e2e-usage-pipeline-noattr","id":"'"$NOATTR_ID"'","time":"2026-05-06T11:00:00Z","datacontenttype":"application/json","data":{"value":"100","dimensions":{"region":"us-west-1","zone":"us-west-1a"}}}' > noattr_event.json
              kubectl cp noattr_event.json -n billing-system "${VECTOR_POD#pod/}:/tmp/noattr_event.json"
              kubectl exec -n billing-system "$VECTOR_POD" -- \
                wget -q -O- \
                  --header="Content-Type: application/cloudevents+json" \
                  --post-file=/tmp/noattr_event.json \
                  http://127.0.0.1:9880/cloudevents

    - name: wait-for-gateway-batch-4
      description: |
        Wait for the Gateway to batch and process the attribution failure event.
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              echo "Waiting 30s for Gateway event batch to flush..."
              sleep 5
              echo "Done waiting"

    - name: assert-attribution-failure-event-quarantined
      description: |
        Verify that the event reached the billing.usage.p-e2e-usage-pipeline-noattr.quarantine.attribution_failure subject.
      try:
        - script:
            timeout: 60s
            content: |
              set -eu
              NOATTR_ID=$(cat /tmp/noattr_id.txt)
              NATS_POD=$(kubectl get pod -n nats-system -l app.kubernetes.io/component=nats-box --no-headers -o name | head -1)

              DEADLINE=$(($(date +%s) + 55))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                MSG=$(kubectl exec -n nats-system "$NATS_POD" -- \
                  nats --server nats://nats:4222 \
                  sub --all -T --stream billing-usage \
                  --timeout 1s \
                  "billing.usage.p-e2e-usage-pipeline-noattr.quarantine.attribution_failure" \
                  2>/dev/null || true)
                if echo "$MSG" | grep -q "$NOATTR_ID"; then
                  echo "SUCCESS: event $NOATTR_ID found in quarantine queue"
                  exit 0
                fi
                echo "Waiting for event $NOATTR_ID in quarantine..."
                sleep 2
              done
              echo "FAIL: event $NOATTR_ID did not reach quarantine" >&2
              exit 1

    - name: send-malformed-event
      description: |
        Send a malformed event directly to NATS bypassing the Gateway (invalid subject format, not starting with "projects/").
        The consumer must drop the event and record it as malformed.
      try:
        - script:
            timeout: 30s
            content: |
              set -eu
              export LC_ALL=C
              MALFORMED_ID="01HVJ$(head -c 500 /dev/urandom | tr -dc '0123456789ABCDEFGHJKMNPQRSTVWXYZ' | head -c 21)"
              echo "Generated Malformed Event ID: $MALFORMED_ID"
              echo "$MALFORMED_ID" > /tmp/malformed_id.txt

              NATS_POD=$(kubectl get pod -n nats-system \
                -l app.kubernetes.io/component=nats-box \
                --no-headers -o name | head -1)
              if [ -z "$NATS_POD" ]; then
                echo "ERROR: no nats-box pod found" >&2
                exit 1
              fi

              kubectl exec -n nats-system "$NATS_POD" -- \
                nats pub \
                  --server nats://nats:4222 \
                  billing.usage.p-e2e-usage-pipeline.ingest \
                  '{"specversion":"1.0","id":"'"$MALFORMED_ID"'","type":"e2e-cpu-seconds","source":"/e2e/test","subject":"not-starting-with-projects","datacontenttype":"application/json","time":"2026-05-06T11:00:00Z","data":{"value":"100"}}'
              echo "Malformed event published directly to NATS"

    - name: wait-for-gateway-batch-5
      description: |
        Wait for the Gateway to batch and process the malformed event.
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              echo "Waiting 30s for Gateway event batch to flush..."
              sleep 5
              echo "Done waiting"

    - name: assert-consumer-metrics
      description: |
        Query the billing-controller-manager's secure /metrics endpoint on port 8443
        and assert that the rejections and malformed metrics are non-zero with correct labels.
      try:
        - script:
            timeout: 60s
            content: |
              set -eu

              # Get all replica pod IPs for the controller manager
              MANAGER_IPS=$(kubectl get pods -n billing-system \
                -l control-plane=billing \
                -o jsonpath='{.items[*].status.podIP}')

              COLLECTOR_POD=$(kubectl get pod -n billing-system \
                -l app.kubernetes.io/instance=billing-usage-collector \
                --no-headers -o name | head -1)

              DEADLINE=$(($(date +%s) + 50))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                UNKMETER=0
                INVDIMS=0
                NOATTR=0
                MALFORMED=0

                # Sum the metrics across all replicas (since only the leader handles events)
                for IP in $MANAGER_IPS; do
                  METRICS=$(kubectl exec -n billing-system "$COLLECTOR_POD" -- \
                    sh -c "TOKEN=\$(cat /var/run/secrets/kubernetes.io/serviceaccount/token) && wget -q -O- --no-check-certificate --header=\"Authorization: Bearer \$TOKEN\" https://$IP:8443/metrics" 2>/dev/null || true)

                  if [ -n "$METRICS" ]; then
                    U=$(echo "$METRICS" | grep -E '^billing_validation_rejections_total\{.*reason="unknown_meter".*\}' | awk '{sum += $NF} END {print int(sum+0)}')
                    I=$(echo "$METRICS" | grep -E '^billing_validation_rejections_total\{.*reason="invalid_dimensions".*\}' | awk '{sum += $NF} END {print int(sum+0)}')
                    N=$(echo "$METRICS" | grep -E '^billing_validation_rejections_total\{.*reason="attribution_failure".*\}' | awk '{sum += $NF} END {print int(sum+0)}')
                    M=$(echo "$METRICS" | grep -E '^billing_consumer_malformed_total\{.*reason="invalid_subject".*\}' | awk '{sum += $NF} END {print int(sum+0)}')

                    UNKMETER=$((UNKMETER + U))
                    INVDIMS=$((INVDIMS + I))
                    NOATTR=$((NOATTR + N))
                    MALFORMED=$((MALFORMED + M))
                  fi
                done

                echo "Aggregated Metrics: unknown_meter=$UNKMETER, invalid_dimensions=$INVDIMS, attribution_failure=$NOATTR, malformed=$MALFORMED"

                if [ "$UNKMETER" -gt 0 ] && [ "$INVDIMS" -gt 0 ] && [ "$NOATTR" -gt 0 ] && [ "$MALFORMED" -gt 0 ]; then
                  echo "SUCCESS: all consumer metrics successfully recorded and non-zero"
                  exit 0
                fi
                sleep 5
              done

              echo "FAIL: not all required metrics were recorded or non-zero within timeout" >&2
              exit 1
