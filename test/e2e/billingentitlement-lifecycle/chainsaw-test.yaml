apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: billingentitlement-lifecycle
spec:
  description: |
    Tests the BillingEntitlement lifecycle including:
    - Creating a BillingAccount, GA Offer, and BillingEntitlement
    - Entitlement becomes Ready with OfferAssigned
    - Webhook rejects a second entitlement for the same billing account
    - A contract's start date must be midnight UTC, at most 31 days back,
      and can't be added, moved or removed after creation

  steps:
    - name: ensure-milo-system
      description: Ensure milo-system exists for ServicePricing defaults.
      try:
        - script:
            content: |
              kubectl create namespace milo-system --dry-run=client -o yaml | kubectl apply -f -

    - name: create-meter
      description: |
        Create the MeterDefinition the ServicePricing selects. Waiting for
        Ready means the operator's cache, which the webhook reads, has it.
      try:
        - create:
            file: 01-create-meter.yaml
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: e2e-be-cpu-allocated
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: Published
                    status: "True"

    - name: create-prerequisites
      description: Create ServicePricing, Draft Offer, and BillingAccount.
      try:
        - create:
            file: 01-create-servicepricing.yaml
        - create:
            file: 01-create-offer.yaml
        - create:
            file: 01-create-account.yaml

    - name: publish-offer
      description: Publish the Offer so it can be assigned via BillingEntitlement.
      try:
        - script:
            content: |
              kubectl patch offer e2e-be-standard-compute --type=merge --patch '{"spec":{"launchStage":"GA"}}'
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: Offer
              metadata:
                name: e2e-be-standard-compute
              spec:
                launchStage: GA
              status:
                conditions:
                  - type: Ready
                    status: "True"
                    reason: OfferReady
                  - type: Published
                    status: "True"
                    reason: OfferPublished

    - name: create-entitlement
      description: Create a BillingEntitlement binding the account to the GA Offer.
      try:
        - create:
            file: 01-create-entitlement.yaml
        - assert:
            timeout: 60s
            file: assertions/assert-ready.yaml

    - name: reject-duplicate-entitlement
      description: Verify a second BillingEntitlement for the same account is rejected.
      try:
        - create:
            file: 02-create-duplicate-entitlement.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'already has billing entitlement')): true

    - name: reject-contract-added-later
      description: A contract can only be set when the entitlement is created.
      try:
        - script:
            content: |
              start=$(date -u +%Y-%m-%dT00:00:00Z)
              kubectl patch billingentitlement e2e-be-entitlement -n default --type=merge \
                --patch "{\"spec\":{\"contract\":{\"startsAt\":\"$start\"}}}"
            check:
              ($error != null): true
              (contains($stderr, 'contract can only be set when the entitlement is created')): true

    - name: create-contract-account
      description: A second billing account for the contract entitlement.
      try:
        - create:
            file: 03-create-contract-account.yaml

    - name: reject-bad-contract-starts
      description: |
        A contract start more than 31 days back, or not at midnight UTC, is
        rejected.
      try:
        - script:
            content: |
              old=$(date -u -d '40 days ago' +%Y-%m-%dT00:00:00Z 2>/dev/null || date -u -v-40d +%Y-%m-%dT00:00:00Z)
              cat <<YAML | kubectl create -f -
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-be-contract
                namespace: default
              spec:
                billingAccountRef:
                  name: e2e-be-contract-account
                offerRef:
                  name: e2e-be-standard-compute
                contract:
                  startsAt: "$old"
              YAML
            check:
              ($error != null): true
              (contains($stderr, 'must be no more than 31 days in the past')): true
        - script:
            content: |
              start=$(date -u +%Y-%m-%dT09:30:00Z)
              cat <<YAML | kubectl create -f -
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-be-contract
                namespace: default
              spec:
                billingAccountRef:
                  name: e2e-be-contract-account
                offerRef:
                  name: e2e-be-standard-compute
                contract:
                  startsAt: "$start"
              YAML
            check:
              ($error != null): true
              (contains($stderr, 'must be midnight UTC')): true

    - name: create-contract-entitlement
      description: A contract starting a week ago, entered today, is accepted.
      try:
        - script:
            content: |
              start=$(date -u -d '7 days ago' +%Y-%m-%dT00:00:00Z 2>/dev/null || date -u -v-7d +%Y-%m-%dT00:00:00Z)
              cat <<YAML | kubectl create -f -
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-be-contract
                namespace: default
              spec:
                billingAccountRef:
                  name: e2e-be-contract-account
                offerRef:
                  name: e2e-be-standard-compute
                contract:
                  startsAt: "$start"
              YAML
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-be-contract
                namespace: default
              status:
                conditions:
                  - type: OfferAssigned
                    status: "True"

    - name: reject-contract-changes
      description: The contract's start can't move, and the contract can't be removed.
      try:
        - script:
            content: |
              start=$(date -u +%Y-%m-%dT00:00:00Z)
              kubectl patch billingentitlement e2e-be-contract -n default --type=merge \
                --patch "{\"spec\":{\"contract\":{\"startsAt\":\"$start\"}}}"
            check:
              ($error != null): true
              (contains($stderr, 'contract.startsAt is immutable')): true
        - script:
            content: |
              kubectl patch billingentitlement e2e-be-contract -n default --type=json \
                --patch '[{"op":"remove","path":"/spec/contract"}]'
            check:
              ($error != null): true
              (contains($stderr, 'contract can only be set when the entitlement is created')): true

    - name: cleanup
      description: Delete entitlements, offer, accounts, and ServicePricing.
      try:
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              name: e2e-be-contract
              namespace: default
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              name: e2e-be-contract-account
              namespace: default
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              name: e2e-be-entitlement
              namespace: default
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: Offer
              name: e2e-be-standard-compute
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              name: e2e-be-account
              namespace: default
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: ServicePricing
              name: e2e-be-cpu-allocated
              namespace: milo-system
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              name: e2e-be-cpu-allocated
