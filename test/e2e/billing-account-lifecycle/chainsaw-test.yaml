apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: billing-account-lifecycle
spec:
  description: |
    Tests the BillingAccount lifecycle including:
    - Creating an account transitions to Ready
    - CRD validation rejects invalid currency codes
    - CurrencyCode is immutable after activation
    - Contact info and payment terms are configurable

  steps:
    - name: create-account
      description: Create a BillingAccount. Should become Ready.
      try:
        - create:
            file: 01-create-account.yaml
        - assert:
            timeout: 30s
            file: assertions/assert-ready.yaml

    - name: reject-invalid-currency
      description: Verify that a BillingAccount with an invalid currency code is rejected.
      try:
        - create:
            file: test-data/invalid-currency.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'currencyCode')): true

    # Note: currencyCode immutability is enforced by the webhook, which
    # requires TLS certificates. This test is skipped when webhooks are not
    # deployed. See the webhook deployment overlay for full validation.

    - name: update-contact-info
      description: Verify that contact info can be updated on a Ready account.
      try:
        - apply:
            file: 03-account-with-contact.yaml
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: lifecycle-test-account
                namespace: default
              spec:
                contactInfo:
                  email: billing@example.com
                  name: Billing Department

    - name: reject-currency-update
      description: Verify that updating the currencyCode on an active account is rejected.
      try:
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"currencyCode":"EUR"}}' 2>&1 | grep -q "currencyCode is immutable"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject currencyCode change" >&2
                exit 1
              fi

    - name: reject-invalid-contact-info
      description: Verify that contact info updates with invalid emails or country codes are rejected.
      try:
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"contactInfo":{"email":"not-an-email"}}}' 2>&1 | grep -q "must be a valid email address"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject invalid email address" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"contactInfo":{"email":"billing@example.com","address":{"country":"invalid"}}}}' 2>&1 | grep -q "country"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject invalid country code" >&2
                exit 1
              fi

    - name: test-payment-terms-validation
      description: Verify that configuring invalid payment terms is rejected, and valid ones are accepted.
      try:
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"paymentTerms":{"invoiceFrequency":"Weekly"}}}' 2>&1 | grep -q "invoiceFrequency"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject invalid invoiceFrequency" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"paymentTerms":{"invoiceDayOfMonth":29}}}' 2>&1 | grep -q "invoiceDayOfMonth"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject invalid invoiceDayOfMonth" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"paymentTerms":{"netDays":0}}}' 2>&1 | grep -q "netDays"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject invalid netDays" >&2
                exit 1
              fi
        - script:
            content: |
              kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"paymentTerms":{"netDays":45,"invoiceFrequency":"Quarterly","invoiceDayOfMonth":15}}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: lifecycle-test-account
                namespace: default
              spec:
                paymentTerms:
                  netDays: 45
                  invoiceFrequency: Quarterly
                  invoiceDayOfMonth: 15

    - name: test-tax-id-validation
      description: Verify that invalid tax ID formats or duplicates are rejected, and valid ones are accepted.
      try:
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"taxIds":[{"type":"invalid-type","value":"12345"}]}}' 2>&1 | grep -q -E "tax ID type|type"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject invalid tax ID type format" >&2
                exit 1
              fi
        - script:
            content: |
              if kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"taxIds":[{"type":"us_ein","value":"12-34567"},{"type":"us_ein","value":"98-76543"}]}}' 2>&1 | grep -q -i "duplicate"; then
                echo "Rejected as expected"
              else
                echo "Error: Did not reject duplicate tax ID types" >&2
                exit 1
              fi
        - script:
            content: |
              kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"taxIds":[{"type":"us_ein","value":"12-34567"},{"type":"gb_vat","value":"GB1234567"}]}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: lifecycle-test-account
                namespace: default
              spec:
                taxIds:
                  - type: us_ein
                    value: "12-34567"
                  - type: gb_vat
                    value: "GB1234567"

    - name: test-contact-info-removal
      description: Verify that contact info can be updated/removed.
      try:
        - script:
            content: |
              kubectl patch billingaccount lifecycle-test-account -n default --type=merge --patch '{"spec":{"contactInfo":null}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: lifecycle-test-account
                namespace: default

    - name: transition-to-suspended
      description: Verify that setting status phase to Suspended updates the Ready condition to False.
      try:
        - script:
            content: |
              kubectl patch billingaccount lifecycle-test-account -n default --type=merge --subresource=status --patch '{"status":{"phase":"Suspended"}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: lifecycle-test-account
                namespace: default
              status:
                phase: Suspended
                conditions:
                  - type: Ready
                    status: "False"
                    reason: BillingAccountNotReady
                    message: "Billing account is in Suspended phase."
                  - type: DefaultPaymentMethodReady
                    status: "False"
                    reason: NotConfigured
                  - type: InvoicingReady
                    status: "True"
                    reason: NoInvoicesYet

    - name: transition-to-archived
      description: Verify that setting status phase to Archived updates the Ready condition to False.
      try:
        - script:
            content: |
              kubectl patch billingaccount lifecycle-test-account -n default --type=merge --subresource=status --patch '{"status":{"phase":"Archived"}}'
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: lifecycle-test-account
                namespace: default
              status:
                phase: Archived
                conditions:
                  - type: Ready
                    status: "False"
                    reason: BillingAccountNotReady
                    message: "Billing account is in Archived phase."
                  - type: DefaultPaymentMethodReady
                    status: "False"
                    reason: NotConfigured
                  - type: InvoicingReady
                    status: "True"
                    reason: NoInvoicesYet
