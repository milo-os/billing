# pnpm settings for the plugin (pnpm reads its own settings here, not from
# .npmrc). Not a workspace: there is one package.

# Refuse to install on a Node or pnpm version outside package.json's engines.
engineStrict: true

# Wait a day before installing a newly published version. Most compromised
# releases are pulled within hours. Our own packages are published and
# consumed across repos on the same day, so the delay must not hold them back.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Reject a version published with weaker provenance than the versions before
# it, such as a release pushed with a stolen token for a package that normally
# publishes from CI.
trustPolicy: no-downgrade

overrides:
  # recharts 3.2.1 pins reselect 5.1.1, which was published without the
  # provenance 5.1.0 had, so trustPolicy rejects it. 5.2.0 publishes from CI
  # and is what recharts 3.9.0 and later pin.
  reselect@5.1.1: 5.2.0

# Dependencies allowed to run install scripts; pnpm refuses any other.
# esbuild's checks its platform binary (Vite's bundler). The image installs
# with --ignore-scripts.
allowBuilds:
  esbuild: true

# @reduxjs/toolkit (through recharts) ships agent skills. Nothing here builds
# or runs them.
permissions:
  '@reduxjs/toolkit':
    skills: false
