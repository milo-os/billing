# GoReleaser config for the milo-usage datumctl plugin.
#
# Publishing a GitHub release for a semver tag (vX.Y.Z) runs
# .github/workflows/release-plugin.yaml, which builds the plugin for each
# platform and attaches per-platform archives + checksums.txt to the release.
# The datumctl plugin catalog entry (milo-os/cli-plugins, plugins/usage.yaml)
# references these exact asset names, so the archive name_template must not
# change casually.
#
# The plugin is its own Go module (cmd/milo-usage/go.mod) so the datumctl SDK's
# dependencies don't move the operator's.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: milo-usage

before:
  hooks:
    - sh -c "cd cmd/milo-usage && go mod tidy"

builds:
  - id: milo-usage
    dir: cmd/milo-usage
    main: .
    binary: milo-usage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Report the release version (the tag without its leading "v") from
    # --plugin-manifest instead of the in-source "0.0.0".
    ldflags:
      - -s -w
      - -X main.pluginVersion={{ .Version }}

archives:
  - id: milo-usage
    # Linux/Darwin/Windows and x86_64 for amd64, matching the other milo
    # plugins (milo-usage_Darwin_arm64, milo-usage_Linux_x86_64, ...).
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

